/* ================= Render ================= */
let last=0,blipCount=0;
function titleSync(){
  const on=(S.mode==='title');
  $title.classList.toggle('on',on);
  document.getElementById('frame').style.visibility=on?'hidden':'';
}
$title.addEventListener('pointerdown',e=>{e.preventDefault();audioInit();SFX.page();S.mode='intro';titleSync();introProfile();});
function frame(t){
  if(S.mode==='title'){drawTitleArt(t);}
  titleSync();
  const dt=Math.min(60,t-last)/1000;last=t;

  // Schreibmaschine
  if(S.typing){
    if(S.pause>0)S.pause-=dt;
    else{
      const before=Math.floor(S.shown);
      S.shown+=dt*52;
      const now=Math.min(S.full.length,Math.floor(S.shown));
      for(let i=before;i<now;i++){
        const chr=S.full[i];
        if(chr==='.'||chr==='?'||chr==='!')S.pause=0.20;
        else if(chr===','||chr===';'||chr==='—')S.pause=0.09;
        if(/[a-zA-ZäöüÄÖÜ]/.test(chr)&&(++blipCount%3===0))SFX.blip();
      }
      if(S.shown>=S.full.length){S.shown=S.full.length;S.typing=false;flushOpts();
        if(S.autoNext)S.autoT=t+620;}
    }
  }
  // Auto-Weiter nach Kevins Echo — Lauren antwortet ohne Extra-Klick
  if(S.autoT&&t>S.autoT){const f=S.autoNext;S.autoNext=null;S.autoT=0;if(f)f();}

  // Zeitsprung: mit ihrer Nachricht schneiden wir in Kevins Schlafzimmer, 07:02
  ((S.bed||S.phone)?sceneBed:SCENE[S.scene])(t);

  // Atem-Physik
  if(S.mode==='play'&&S.run){
    const r=S.run,k=dt*60;                       // framerate-unabhängig (60-fps-Kalibrierung)
    r.v+=(r.hold?r.rise:-r.fall)*k;
    r.v=Math.max(0,Math.min(100,r.v));
    r.center=50+34*Math.sin((t-r.t0)*r.speed*2)+8*Math.sin((t-r.t0)*r.speed*5.3);
    r.center=Math.max(18,Math.min(82,r.center));
    r.inband=r.v>=r.center-r.band/2&&r.v<=r.center+r.band/2;
    r.focus+=(r.inband?1:-r.drain)*k;
    S.breath=r.v/100;
    breathUpdate(S.breath,r.hold,r.inband);
    if(r.focus>=r.need)waveWon(); else if(r.focus<=0)waveLost();
  }else if(S.mode==='hold'&&S.retn){
    S.breath=0.12;                                  // Lunge leer, alles hält
    const r=S.retn, el=t-r.t0;
    if(r.broke||el>=r.need){retentionDone();}
  }else{
    S.breath=0.5+0.5*Math.sin(t/900);
  }

  /* Ab hier zeichnet alles in die Malschicht — Figuren, Requisiten, Tram, Rad.
     fgEnd() weiter unten zieht sie gekörnt und im Licht des Raums aufs Bild. */
  const fgScene=S.scene;
  fgBegin();

  // Kevins Rad steht am Späti — gehört zur Figurenebene, nicht in die gemalte Kulisse
  if(S.scene==='street'&&S.mode!=='ride'){PS=1.5;drawEBike(2,-14,0.78,0,false);PS=1;}
  if(S.scene==='front'){PS=1.5;drawEBike(0,0,1,0,true);PS=1;}

  // Jonas hinten in der Lücke zwischen den beiden Matten (mit Kontaktschatten)
  if(S.jonas&&S.scene==='studio'){
    const jSit=(S.pose==='sit');                 // Jonas setzt sich mit, wenn alle sitzen
    const jx=jSit?190:182, jsc=1.4;
    PS=1;px(jx+14,209,40,5,'rgba(10,6,20,0.30)');
    const jPose=jSit?(medNow()?'me':'si'):'st';
    if(!sprAt('j',jPose,jx,jSit?112:84,jsc,jSit,t,{phase:2.2,breath:0.5,talking:S.typing&&S.who==='j'}))
      figure(jx,jSit?112:84,1.4,JONAS,t,0.5,jSit,2.2,true,(S.mode==='play')?'medi':'neutral',0,S.typing&&S.who==='j',false,null,0,true);
  }

  // Lauren
  const lb=(S.mode==='hold')?0.12:(S.mode==='play')?0.5+0.5*Math.sin(t/1300):0.5+0.5*Math.sin(t/1050);
  const mood=(S.mode==='play'||S.mode==='hold')?'medi':((t<S.moodT)?S.mood:'neutral');
  const mage=(performance.now()-S.moodStart)/1000;
  let lx,ly,showL=!S.gone&&S.mode!=='intro'&&S.mode!=='title'&&!S.bed;
  // sitzend: mittig auf der roten Matte (aus dem gemalten Raum ausgemessen)
  if(S.scene==='studio'){ lx=S.pose==='sit'?254:278; ly=S.pose==='sit'?118:56; }
  else if(S.scene==='front'){ lx=296; ly=84; }
  else { lx=298; ly=82; }

  // Kevin wird erst NACH der Tram gezeichnet (siehe unten) — er steht am Bahnsteig davor,
  // die Tram fährt hinter ihm durch.

  /* Tram-Sequenz */
  if(S.mode==='tram'&&S.tram){
    const el=(t-S.tram.t0)/1000;
    let tx;                                              // Tram-Position (320er-Raum)
    if(el<2.0){ tx=340-(340-88)*Math.min(1,el/2.0); }    // einfahren
    else if(el<6.4){ tx=88; }                            // stehen
    else { tx=88-(el-6.4)*130; }                         // abfahren
    const doorOpen=(el>2.2&&el<5.4);
    if(el>=2.0&&el<2.25) { if(!S.tram.dingDone){S.tram.dingDone=true;tone(1046.5,0.16,'square',0.05);tone(784,0.2,'square',0.04,0.16);} }
    if(el>=5.4&&!S.tram.closeDone){S.tram.closeDone=true;tone(196,0.35,'triangle',0.06,0,140);}
    if(el>=6.4&&!S.tram.goDone){S.tram.goDone=true;tone(140,2.2,'sawtooth',0.045,0,300);}

    // sie geht die letzten Schritte ZUR TÜR und steigt ein
    if(el<2.4){ /* steht noch */ }
    else if(el<3.9){ const p=(el-2.4)/1.5; lx=298-p*52; ly=82+p*3; }
    else { showL=false; S.gone=true; }

    drawTram(tx,doorOpen,t);
    // sie winkt im Fenster, während die Tram wegfährt
    if(el>5.6){
      // Lauren im Tram-Fenster — im Stil der Figuren, nicht als Pixelklotz
      ctx.save();ctx.scale(1.5,1.5);
      const wx=tx+40;
      ctx.fillStyle='#12091e';ctx.beginPath();ctx.ellipse(wx+5,113,7.4,5.4,0,0,7);ctx.fill();
      ctx.fillStyle='#3f8f86';ctx.beginPath();ctx.ellipse(wx+5,113,6.6,4.6,0,0,7);ctx.fill();
      ctx.fillStyle='#12091e';ctx.beginPath();ctx.arc(wx+5,106.5,5.6,0,7);ctx.fill();
      ctx.fillStyle='#f7d7b8';ctx.beginPath();ctx.arc(wx+5,106.5,4.8,0,7);ctx.fill();
      ctx.fillStyle='#e2c97e';
      ctx.beginPath();ctx.arc(wx+5,105.6,4.8,Math.PI,0);ctx.fill();
      ctx.fillRect(wx+0.2,105.4,1.7,5.4);ctx.fillRect(wx+8.1,105.4,1.7,5.4);
      ctx.fillStyle='#1a1620';ctx.fillRect(wx+3.3,106.2,1,1.2);ctx.fillRect(wx+5.9,106.2,1,1.2);
      ctx.strokeStyle='#a24e5e';ctx.lineWidth=0.7;
      ctx.beginPath();ctx.moveTo(wx+3.4,109.3);ctx.quadraticCurveTo(wx+5,110.2,wx+6.6,109.3);ctx.stroke();
      if(S.tram.cfg.yes){
        const up=Math.sin(t/160)>0?0:1.6;
        ctx.fillStyle='#f7d7b8';
        ctx.beginPath();ctx.arc(wx-1.6,104-up,1.7,0,7);ctx.fill();
        ctx.beginPath();ctx.arc(wx+11.6,104-up,1.7,0,7);ctx.fill();
      }
      ctx.restore();
    }
    if(el>8.6&&!S.tram.done){S.tram.done=true;tramDone();}
  }

  /* Heimfahrt: Kevin auf dem E-Bike aus dem Bild raus */
  if(S.mode==='ride'&&S.ride){
    const el=(t-S.ride.t0)/1000;
    const p=Math.min(1,el/3.6);
    const dx=8-p*p*250;                        // beschleunigt nach links weg
    const bob=Math.sin(el*11)*1.2;             // Tritt-Wippen
    const kcx=(87+dx)*1.5-31, ktop=45+bob;     // Hüfte sitzt auf dem Sattel, Füße auf Pedalhöhe
    PS=1;px(kcx+6,240,84,7,'rgba(10,6,20,0.30)');
    if(!sprAt('k','st',kcx,ktop,1.8,false,t,{breath:0.5+0.5*Math.sin(t/700),phase:0.6,tilt:0.04}))
      figure(kcx,ktop,1.8,KEVFIG,t,0.5+0.5*Math.sin(t/700),false,0.6,false,'neutral',0,false,false,null,-1,false);
    drawEBike(dx,-105,1.5,-el*7,false);        // Rad VOR ihm — verdeckt die Beine wie beim Fahren
    if(el>3.9&&!S.ride.done){S.ride.done=true;endStep();}
  }

  // Kevin — du selbst, links im Bild, ihr zugewandt (nach der Tram gezeichnet = er steht davor)
  if(S.mode!=='ride'&&S.mode!=='intro'&&S.mode!=='title'&&!S.bed&&(S.mode!=='end'||!S.phone)){
    const kSit=(S.scene==='studio'&&S.pose==='sit');
    let kx,ky;
    if(S.scene==='studio'){kx=kSit?93:104;ky=kSit?118:56;}    // sitzend: mittig auf der türkisen Matte
    else if(S.scene==='front'){kx=112;ky=84;}
    else if(S.mode==='tram'){kx=56;ky=96;}                    // am Bahnsteig, näher an der Kamera
    else {kx=104;ky=82;}
    const ksc=(S.scene==='street')?1.8:2;
    const kfeet=kSit?ky+134:Math.round(ky+89*ksc);
    PS=1;px(kx+10,kfeet,Math.round(38*ksc),7,'rgba(6,4,14,0.5)');px(kx+16,kfeet+5,Math.round(26*ksc),4,'rgba(6,4,14,0.3)');
    const kProp=(S.scene==='street'&&S.bottle)?'bottle':(S.scene==='front'&&S.kbar)?'bar':null;
    const kBreath=(S.mode==='play'||S.mode==='hold')?S.breath:0.5+0.5*Math.sin(t/1000+2);
    S._kx=kx;
    const kPose=kSit?(medNow()?'me':'si'):'st';
    if(!sprAt('k',kPose,kx,ky,ksc,kSit,t,{breath:kBreath,talking:S.typing&&S.who==='k',phase:0.6,
        prop:kProp==='bar'?'riegel':kProp,propSide:'r'}))
      figure(kx,ky,ksc,KEVFIG,t,kBreath,kSit,0.6,false,((S.mode==='play'||S.mode==='hold'))?'medi':'neutral',0,S.typing&&S.who==='k',false,kProp,1,S.scene==='studio');
  }

  if(showL){
    const sc=(S.scene==='street')?1.8:2;
    const feet=(S.scene==='studio'&&S.pose==='sit')?ly+134:Math.round(ly+89*sc);
    PS=1;px(lx+10,feet,Math.round(38*sc),7,'rgba(10,6,20,0.32)');px(lx+18,feet+5,Math.round(30*sc),4,'rgba(10,6,20,0.22)');
    S._lx=lx;
    const lTalk=S.typing&&S.who==='l';
    const lWalk=S.mode==='tram'&&S.tram&&((t-S.tram.t0)/1000)>=2.4&&((t-S.tram.t0)/1000)<3.9;
    const lProp=S.phoneHand?'phone':(S.scene==='front'&&S.riegel)?'riegel':(S.scene==='street'&&S.bottle)?'bottle':null;
    const lSit=S.scene==='studio'&&S.pose==='sit';
    const lPose=lSit?(medNow()?'me':'si'):'st';
    if(!sprAt('l',lPose,lx,ly,sc,lSit,t,{breath:lb,talking:lTalk,walk:lWalk,phase:1.4,
        prop:lProp,propSide:'l'}))
      figure(lx,ly,sc,LAUREN,t,lb,lSit,1.4,false,mood,mage,lTalk,lWalk,lProp,-1,S.scene==='studio');
    // Tränen — während der Wellen (ab Welle 2) UND danach, deutlich sichtbar
    const cryNow=(S.teary&&S.scene==='street'&&S.mode!=='tram')||(S.mode==='play'&&S.run&&S.run.wave>=1)||(S.mode==='hold'&&S.retn&&S.retn.i>=1);
    if(cryNow){
      PS=1;
      const t1x=lx+Math.round(15*sc), t2x=lx+Math.round(29*sc), ty0=ly+Math.round(20.5*sc);
      const drop=(t/700)%1;
      ctx.fillStyle='rgba(170,205,255,0.85)';
      ctx.beginPath();ctx.ellipse(t1x,ty0+3+drop*7,2,3.1,0,0,7);ctx.fill();
      ctx.beginPath();ctx.ellipse(t2x,ty0+5+((drop+0.4)%1)*6,1.7,2.6,0,0,7);ctx.fill();
      ctx.fillStyle='rgba(255,255,255,0.5)';
      ctx.fillRect(t1x-1,ty0+2+drop*7,1,1);
      px(t1x-3,ty0-1,7,2,'rgba(190,214,255,0.35)');       // glasiger Unterlid-Schimmer
      px(t2x-3,ty0-1,7,2,'rgba(190,214,255,0.30)');
    }
    // Requisiten zeichnet figure() jetzt direkt in ihrer Hand (prop-Parameter)
  }

  fgEnd(fgScene);          // Malschicht aufs Bild: gekörnt, im Licht des Raums

  // (POV abgeschafft — Kevin steht als Figur im Bild)

  // Grading: eint gemalten Hintergrund und gezeichnete Figuren
  if((S.scene==='front'||S.scene==='studio'||S.scene==='street')&&S.mode!=='title'&&S.mode!=='intro'&&!S.bed){
    PS=1;
    ctx.save();
    ctx.globalCompositeOperation='multiply';
    const gm=ctx.createLinearGradient(0,0,0,H);
    gm.addColorStop(0,'#9d9ce4');gm.addColorStop(0.5,'#b9b2e0');gm.addColorStop(1,'#d6c6c4');
    ctx.fillStyle=gm;ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation='screen';
    const lx0=S.scene==='studio'?W*0.5:S.scene==='street'?W*0.22:W*0.60;
    const ly0=S.scene==='studio'?H*0.42:H*0.52;
    const gl=ctx.createRadialGradient(lx0,ly0,10,lx0,ly0,W*0.55);
    gl.addColorStop(0,'rgba(150,92,26,0.5)');gl.addColorStop(0.5,'rgba(80,48,14,0.2)');gl.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=gl;ctx.fillRect(0,0,W,H);
    ctx.restore();
  }

  // HUD
  if(S.mode==='play'&&S.run){
    PS=1.5;
    const r=S.run,bx=294,by=44,bw=14,bh=112;
    px(bx-2,by-2,bw+4,bh+4,'rgba(0,0,0,0.66)');
    px(bx,by,bw,bh,'#141428');
    const lo=r.center-r.band/2;
    const byTop=by+bh-((lo+r.band)/100)*bh;
    px(bx,byTop,bw,(r.band/100)*bh,r.inband?'rgba(255,224,102,0.34)':'rgba(120,140,220,0.24)');
    px(bx,byTop,bw,1,'#ffe066');px(bx,byTop+(r.band/100)*bh-1,bw,1,'#ffe066');
    const vy=by+bh-(r.v/100)*bh;
    px(bx-3,vy-1,bw+6,3,r.inband?'#ffffff':'#ff9a7a');
    px(72,186,176,7,'rgba(0,0,0,0.66)');
    px(74,188,170,3,'#1c1c30');
    px(74,188,Math.max(0,Math.round((r.focus/r.need)*170)),3,r.inband?'#8fe6d2':'#5a6a9a');
    PS=1;
    ctx.font='bold 11px ui-monospace,"Courier New",monospace';ctx.textBaseline='top';
    const lbl=`WELLE ${r.wave+1}/${NW}`;
    ctx.fillStyle='#000';for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++)if(a||b)ctx.fillText(lbl,21+a,252+b);
    ctx.fillStyle='#ffe066';ctx.fillText(lbl,21,252);
  }

  // Retention-Anzeige: ein Balken, der sich füllt, während niemand atmet
  if(S.mode==='hold'&&S.retn){
    PS=1.5;
    const r=S.retn, p=Math.min(1,(t-r.t0)/r.need), rest=Math.max(0,Math.ceil((r.need-(t-r.t0))/1000));
    px(72,182,176,13,'rgba(0,0,0,0.7)');
    px(74,184,172,9,'#141428');
    px(74,184,Math.round(172*p),9,'#8fe6d2');
    PS=1;
    ctx.font='bold 11px ui-monospace,"Courier New",monospace';ctx.textBaseline='top';ctx.textAlign='center';
    const lbl='HALTEN · '+rest+'s';
    ctx.fillStyle='#000';for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++)if(a||b)ctx.fillText(lbl,W/2+a,262+b);
    ctx.fillStyle='#8fe6d2';ctx.fillText(lbl,W/2,262);
    ctx.textAlign='left';
  }

  // Titelbild liegt als eigenes Overlay über allem (siehe #title)
  if(S.mode==='title'){
    if(MOBILE_SAY&&$say.textContent!==''){$say.textContent='';$say.className='';}
  }else if(MOBILE_SAY&&S.mode==='intro'){
    if($say.style.display!=='none')$say.style.display='none';
  }else if(MOBILE_SAY){
    if($say.style.display==='none')$say.style.display='';
    // Handy: Text nativ scharf im HTML-Band über der Szene
    const esc=x=>x.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
    const html=sayHTMLFrom(visibleSegs(Math.floor(S.shown)));
    if($say.innerHTML!==html)$say.innerHTML=html;
    // Schriftgröße messen, nicht raten: kleinste Stufe, bei der nichts abgeschnitten wird
    if(S.sayKey!==S.full){
      S.sayKey=S.full;
      const steps=['','mid','long','xl'];
      const keep=$say.innerHTML;
      $say.innerHTML=fullSayHTML();
      for(const st of steps){$say.className=st;if($say.scrollHeight<=$say.clientHeight)break;}
      S.sayCls=$say.className;
      $say.innerHTML=keep;
    }
    if($say.className!==S.sayCls)$say.className=S.sayCls||'';
  }else{
    const ax=S.who==='l'?(S._lx||W/2)+48:S.who==='k'?(S._kx||W/2)+48:S.who==='j'?280:W/2;
    drawSay(visibleSegs(Math.floor(S.shown)),14,ax);
  }

  // Handy-Overlay am Ende: ihre Nachricht ploppt auf
  if(S.phone&&S.mode==='end'){
    PS=1;
    const age=(t-S.phone.t0)/1000;
    if(age<1.6){                                   // Zeitsprung-Karte, bevor das Handy hochkommt
      ctx.globalAlpha=Math.min(1,age/0.3)*Math.min(1,(1.6-age)/0.4);
      ctx.textAlign='center';ctx.textBaseline='top';
      ctx.font='bold 15px ui-monospace,"Courier New",monospace';
      ctx.fillStyle='#000';ctx.fillText(S.phone.card,W/2+2,132+2);
      ctx.fillStyle='#ffe066';ctx.fillText(S.phone.card,W/2,132);
      ctx.textAlign='left';ctx.globalAlpha=1;
    }
    const py=Math.round(300-Math.min(1,age/0.6)*234);
    px(166,py,148,250,'#04040a');
    px(170,py+4,140,242,'#14141f');
    px(178,py+16,124,216,'#0e1a2c');
    px(178,py+16,124,15,'#0a1422');
    ctx.font='bold 9px ui-monospace,monospace';ctx.textBaseline='top';
    ctx.fillStyle='#8fa8c8';ctx.fillText('07:02',184,py+19);
    ctx.fillStyle='#c8d8ea';ctx.fillText('Lauren ✦',184,py+40);
    px(182,py+36,116,1,'#1c2c44');
    if(age>1.1){
      const k=Math.min(1,(age-1.1)/0.3);
      ctx.globalAlpha=k;
      const bx=184,by=py+60+(1-k)*10;
      px(bx,by,112,58,'#1f6b4e');
      px(bx,by,112,2,'#2e8a66');
      px(bx+4,by+56,6,5,'#1f6b4e');
      ctx.fillStyle='#eafaf0';ctx.font='bold 9px ui-monospace,monospace';
      wrapT(S.phone.msg,18).slice(0,4).forEach((ln,i)=>ctx.fillText(ln,bx+7,by+8+i*13));
      ctx.globalAlpha=1;
    }
    px(228,py+238,24,4,'#2c2c3c');
  }

  schedule();
}

/* Ein Scheduler, doppelt abgesichert: rAF wenn verfügbar, sonst treibt der
   Watchdog die Schleife an (gedrosselte WebViews, Energiesparmodus, Emulation). */
let rafPending=false;
function schedule(){
  if(rafPending)return;
  rafPending=true;
  requestAnimationFrame(tt=>{rafPending=false;ctx.setTransform(1,0,0,1,0,0);frame(tt);});
}
setInterval(()=>{ if(performance.now()-last>200) frame(performance.now()); },100);

window.__S=S;window.__dbg={S,portraits,phoneShow,renderPortrait,figure};   // Debug-Griff: Szenen direkt anspringen
/* Referenzblatt der drei Figuren — Vorlage, wenn eine KI sie neu malen soll */
window.__sheet=()=>{
  const s=5.2, W2=Math.round(48*s*3+120), H2=Math.round(92*s+80);
  const o=document.createElement('canvas');o.width=W2;o.height=H2;
  const oc=o.getContext('2d');
  oc.fillStyle='#f2ece0';oc.fillRect(0,0,W2,H2);
  const old=CTX(),oldPS=PS;SETCTX(oc);PS=1;
  const cast=[[LAUREN,-1,false],[KEVFIG,1,true],[JONAS,0,true]];
  cast.forEach(([P,face,socks],i)=>{
    figure(30+i*(48*s+30),40,s,P,1200,0.5,false,i*0.7,true,'neutral',0,false,false,null,face,socks);
  });
  SETCTX(old);PS=oldPS;
  let ta=document.getElementById('dump');
  if(!ta){ta=document.createElement('textarea');ta.id='dump';ta.style.cssText='position:fixed;left:-9999px';document.body.appendChild(ta);}
  ta.value=o.toDataURL('image/png');
  return ta.value.length;
};
reset();
schedule();
})();
</script>
