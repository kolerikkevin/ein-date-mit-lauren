<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Breathwork mit Lauren — ein Date</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕯️</text></svg>">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:#000;color:#e8e8f0;
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Courier New",monospace;
    display:flex;align-items:flex-start;justify-content:center;padding:14px;
    -webkit-font-smoothing:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  }
  #frame{width:100%;max-width:960px}
  canvas{
    display:block;width:100%;height:auto;
    image-rendering:pixelated;image-rendering:crisp-edges;
    background:#000;border:2px solid #16162a;cursor:pointer;
    touch-action:none;user-select:none;
  }
  #ui{background:#07070f;border:2px solid #16162a;border-top:none;padding:9px 12px 11px;min-height:176px}
  #hint{color:#7a7aa8;font-size:11px;letter-spacing:.6px;margin-bottom:7px;text-transform:uppercase}
  ul{list-style:none}
  li{padding:3px 6px 3px 18px;position:relative;cursor:pointer;font-size:14px;line-height:1.45;color:#cfc2e8}
  li:before{content:"›";position:absolute;left:4px;color:#3a3a6a}
  li:hover{color:#ffe066}
  li:hover:before{color:#ffe066}
  #stats{display:flex;gap:20px;align-items:center;margin-top:9px;padding-top:8px;
         border-top:1px solid #16162a;font-size:11px;color:#7a7aa8;letter-spacing:.5px}
  #stats b{color:#e8e8f0;font-weight:normal}
  #mute{margin-left:auto;background:none;border:1px solid #26264a;color:#7a7aa8;
        font:inherit;font-size:11px;padding:2px 8px;cursor:pointer;letter-spacing:.5px}
  #mute:hover{color:#ffe066;border-color:#5a5a2a}
  li{-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  #say{display:none}
  /* Titelbild: eigenes Key-Art, am Handy bildschirmfüllend */
  #title{position:fixed;inset:0;background:#080418;display:none;align-items:center;justify-content:center;z-index:9;cursor:pointer}
  #title.on{display:flex}
  #tc{display:block;width:auto;height:auto;max-width:100%;max-height:100%;border:2px solid #16162a;image-rendering:auto}
  /* Das Handy im Vorspiel: echtes HTML, damit die Schrift scharf bleibt */
  #phone{display:none;background:#0a0714;border:2px solid #16162a;border-bottom:none;padding:14px 0 10px;justify-content:center;align-items:center;min-height:calc(min(960px,94vw)*0.625)}
  #phone.on{display:flex}
  #phone .ph{width:min(330px,88vw);background:#0d0a18;border:3px solid #241c33;border-radius:20px;
             padding:6px 6px 10px;box-shadow:0 6px 24px rgba(0,0,0,.5)}
  #phone .bar{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#7a8aa4;
              padding:4px 10px 8px;letter-spacing:.4px}
  #phone .bar #phtitle{color:#f0b8c8;font-weight:700}
  #phone .body{background:#0e0b1a;border-radius:14px;padding:10px;height:404px;overflow:hidden;position:relative;
               display:flex;flex-direction:column}
  #phone .scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
  #phone .fixbar{flex:none;padding-top:8px;border-top:1px solid #1b2434;margin-top:8px}
  #phone .pic{width:100%;height:172px;object-fit:cover;object-position:center 22%;image-rendering:auto;border-radius:10px;display:block;background:#4a3a72}
  #phone .nm{font-size:21px;font-weight:700;color:#f0b8c8;margin:10px 0 2px;letter-spacing:.5px}
  #phone .sub{font-size:15px;color:#e8eaf0;margin-bottom:3px;font-family:'Avenir Next',Avenir,'Segoe UI',system-ui,sans-serif}
  #phone .loc{font-size:13px;color:#8fe6d2;margin-bottom:9px}
  #phone .prompt{background:#1d1830;border-radius:10px;padding:8px 10px;margin-bottom:8px}
  #phone .prompt b{display:block;font-size:12px;color:#7f9ad0;font-weight:700;margin-bottom:3px;letter-spacing:.3px}
  #phone .prompt span{font-size:15.5px;color:#e8eaf0;line-height:1.42;font-family:'Avenir Next',Avenir,'Segoe UI',system-ui,sans-serif;letter-spacing:.1px}
  #phone .bub{max-width:78%;padding:9px 12px;border-radius:14px;margin-bottom:8px;font-size:15.5px;line-height:1.4;
              word-wrap:break-word;font-family:'Avenir Next',Avenir,'Segoe UI',system-ui,sans-serif;letter-spacing:.1px}
  #phone .bub.her{background:#272038;color:#e8eaf0;border-bottom-left-radius:4px}
  #phone .bub.me{background:#2b4f86;color:#dceaff;margin-left:auto;border-bottom-right-radius:4px}
  #phone .who{font-size:11px;color:#8b93a7;letter-spacing:.4px;margin:0 4px 2px}
  #phone .who.me{text-align:right}
  #phone .caret{opacity:.75;animation:blink 1s steps(1) infinite}
  #phone .typing{display:inline-flex;gap:4px;background:#272038;border-radius:14px;padding:10px 12px}
  #phone .typing span{width:6px;height:6px;border-radius:50%;background:#8b93a7;animation:blink 1.1s infinite}
  #phone .typing span:nth-child(2){animation-delay:.18s}
  #phone .typing span:nth-child(3){animation-delay:.36s}
  @keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}
  #phone .match{text-align:center;padding:6px 0 2px;
                background:linear-gradient(#6a1f48,#a83a63);border-radius:12px}
  #phone .match h2{font-size:27px;line-height:1.05;color:#ffe066;margin:12px 0 4px;
                   text-shadow:2px 2px 0 #2a0c1e;letter-spacing:1px}
  #phone .match .pair{display:flex;justify-content:center;gap:10px;margin:12px 0 6px}
  #phone .match .pair figure{margin:0}
  #phone .match .pair img{width:96px;height:96px;border-radius:50%;border:3px solid #fff;background:#4a3a72;display:block}
  #phone .match .pair figcaption{font-size:12px;color:#ffe9f2;margin-top:5px}
  #phone .match p{font-size:15.5px;font-family:'Avenir Next',Avenir,'Segoe UI',system-ui,sans-serif;color:#ffd9e6;margin:6px 0 12px}
  #phone .match .btn{background:#fff;color:#a83a63;font-weight:700;font-size:14px;border-radius:10px;
                     padding:11px 0;margin:0 14px 14px;letter-spacing:.6px}
  #phone .likebar{display:flex;gap:10px;align-items:center;margin-top:12px}
  #phone .like{flex:1;text-align:center;background:#f0b8c8;color:#2a1020;font-weight:700;font-size:15px;
               border-radius:12px;padding:12px 0;letter-spacing:.6px;cursor:pointer;user-select:none;
               font-family:'Avenir Next',Avenir,'Segoe UI',system-ui,sans-serif}
  #phone .like:active{transform:translateY(1px)}
  #phone .hinweis{margin-top:8px;text-align:center;font-size:13px;color:#ffb4c6;letter-spacing:.4px}
  #phone .skip{width:52px;text-align:center;background:#20283a;color:#8b93a7;border-radius:12px;padding:12px 0;font-size:15px}
  #phone .ph{position:relative;overflow:hidden}
  .heart{position:absolute;font-size:22px;pointer-events:none;animation:rise 1.5s ease-out forwards}
  @keyframes rise{0%{opacity:0;transform:translateY(0) scale(.6)}
                  15%{opacity:1}
                  100%{opacity:0;transform:translateY(-190px) scale(1.25)}}
  @media (max-width:700px){
    body{padding:0;align-items:flex-start}
    #frame{padding-top:6px}
    #say{display:flex;flex-direction:column;justify-content:center;gap:3px;height:132px;overflow:hidden;
         background:#08080f;border:2px solid #16162a;border-bottom:none;
         padding:10px 12px;font-weight:bold;font-size:16px;line-height:1.4;
         text-shadow:1px 1px 0 #000}
    #say.mid{font-size:14px;line-height:1.35}
    #say.long{font-size:12.5px;line-height:1.3}
    #say.xl{font-size:11px;line-height:1.25}
    #say.narr{font-style:italic;font-weight:normal}
    #frame{max-width:none}
    canvas{border-left:none;border-right:none}
    #ui{padding:8px 10px 10px;min-height:0;border-left:none;border-right:none}
    #hint{font-size:10px;margin-bottom:5px}
    li{font-size:16px;line-height:1.4;padding:10px 6px 10px 20px}
    li:before{top:9px}
    li{position:relative}
    #stats{font-size:10px;margin-top:6px;padding-top:6px}
    #phone{padding:10px 0 8px;min-height:0}
    #phone .ph{width:min(340px,94vw)}
    #phone .body{height:min(52vh,392px)}
    #phone .pic{height:158px}
  }
</style>
</head>
<body>
<div id="title"><canvas id="tc" width="420" height="700"></canvas></div>
<div id="frame">
  <div id="say"></div>
  <canvas id="c" width="480" height="300"></canvas>
  <div id="phone" hidden><div class="ph">
    <div class="bar"><span id="phclock">19:12</span><span id="phtitle">hinge</span><span id="phbatt">72%</span></div>
    <div class="body" id="phbody"></div>
  </div></div>
  <div id="ui">
    <div id="hint">…</div>
    <ul id="choices"></ul>
    <div id="stats"><span id="sline"></span><button id="mute" type="button">♪ AN</button></div>
  </div>
</div>
<script>
(() => {
"use strict";

const W=480,H=300;
const cv=document.getElementById('c');
let ctx=cv.getContext('2d');
const CTX=()=>ctx, SETCTX=c=>{ctx=c;};
ctx.imageSmoothingEnabled=false;
const $ch=document.getElementById('choices'),$hint=document.getElementById('hint'),
      $sline=document.getElementById('sline'),$mute=document.getElementById('mute');
/* ================= Titelbild: eigenes Key-Art im Hochformat ================= */
const tcv=document.getElementById('tc'), tx=tcv.getContext('2d');
tx.imageSmoothingEnabled=false;
const $title=document.getElementById('title');
const COVER_HOCH='bilder/cover-hoch.jpg';
const COVER_QUER='bilder/cover-quer.jpg';
const BG_FRONT='bilder/bg-front.jpg';
const bgFront=new Image();bgFront.src=BG_FRONT;
const bgStudio=new Image();bgStudio.src='bilder/bg-studio.jpg';
const bgStreet=new Image();bgStreet.src='bilder/bg-street.jpg';
const bgBed=new Image();bgBed.src='bilder/bg-bed.jpg';
/* Gemalte Bühne einpassen (cover-Zuschnitt, Ausschnitt über anchor steuerbar) */
function drawBG(img,anchor){
  PS=1;
  if(img&&img.complete&&img.naturalWidth){
    ctx.imageSmoothingEnabled=true;
    const sc=Math.max(W/img.naturalWidth,H/img.naturalHeight);
    const w=img.naturalWidth*sc,h=img.naturalHeight*sc;
    ctx.drawImage(img,(W-w)/2,(H-h)*(anchor===undefined?0.5:anchor),w,h);
    ctx.imageSmoothingEnabled=false;
    return true;
  }
  px(0,0,W,H,'#140e28');return false;
}
/* ================= Malschicht für alles Gezeichnete =================
   Die Figuren sollen lustig bleiben — aber nicht wie Vektor-Sticker vor einem
   gemalten Raum kleben. Also laufen Figuren, Requisiten, Tram und Rad durch ein
   halb so großes Offscreen-Canvas und werden ungeglättet hochgezogen: dieselbe
   Pixelkörnung wie im Hintergrund. Danach kommt das Licht des Raums drauf. */
const CVX=cv.getContext('2d');
const FGS=0.8;                 // feiner als 0.5 — sonst zerfallen die Augen zu Ringen
const fgc=document.createElement('canvas');
fgc.width=Math.round(W*FGS);fgc.height=Math.round(H*FGS);
const fgx=fgc.getContext('2d');
const mkc=document.createElement('canvas');
mkc.width=fgc.width;mkc.height=fgc.height;
const mkx=mkc.getContext('2d');
let fgOn=false;
/* Korn: einmal erzeugt, liegt als Muster nur auf den Figuren */
const grainC=document.createElement('canvas');grainC.width=grainC.height=64;
(()=>{const g=grainC.getContext('2d'),d=g.createImageData(64,64);
  for(let i=0;i<d.data.length;i+=4){const v=120+((i*2654435761>>>13)%110);
    d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255;}
  g.putImageData(d,0,0);})();
let grainPat=null;
/* Lichtstimmung je Szene — dieselben Quellen wie im gemalten Bild */
const FGLIGHT={
  studio:{shade:'rgba(52,32,80,0.10)',warm:'rgba(255,168,72,0.16)',x:0.50,y:0.42,r:0.55},
  street:{shade:'rgba(40,30,72,0.13)',warm:'rgba(255,190,104,0.16)',x:0.22,y:0.52,r:0.50},
  front :{shade:'rgba(44,32,84,0.12)',warm:'rgba(255,180,88,0.18)',x:0.60,y:0.52,r:0.52},
  def   :{shade:'rgba(44,32,80,0.09)',warm:'rgba(255,190,110,0.13)',x:0.50,y:0.50,r:0.60}
};
function fgBegin(){
  if(fgOn)return;
  fgx.setTransform(1,0,0,1,0,0);
  fgx.clearRect(0,0,fgc.width,fgc.height);
  fgx.scale(FGS,FGS);
  fgx.imageSmoothingEnabled=false;
  SETCTX(fgx);fgOn=true;
}
function fgEnd(scene){
  if(!fgOn)return;
  SETCTX(CVX);fgOn=false;
  const L=FGLIGHT[scene]||FGLIGHT.def, fw=fgc.width, fh=fgc.height;
  fgx.setTransform(1,0,0,1,0,0);
  fgx.save();
  fgx.globalCompositeOperation='source-atop';      // färbt nur, wo wirklich jemand steht
  fgx.fillStyle=L.shade;fgx.fillRect(0,0,fw,fh);
  const g=fgx.createRadialGradient(fw*L.x,fh*L.y,3,fw*L.x,fh*L.y,fw*L.r);
  g.addColorStop(0,L.warm);g.addColorStop(1,'rgba(255,190,110,0)');
  fgx.fillStyle=g;fgx.fillRect(0,0,fw,fh);
  fgx.restore();
  // Korn: overlay füllt die ganze Fläche, darum vorher die Silhouette sichern
  // und hinterher wieder darauf zurückschneiden.
  if(!grainPat)grainPat=fgx.createPattern(grainC,'repeat');
  mkx.setTransform(1,0,0,1,0,0);
  mkx.globalCompositeOperation='copy';mkx.drawImage(fgc,0,0);
  fgx.save();
  fgx.globalCompositeOperation='overlay';fgx.globalAlpha=0.12;
  fgx.fillStyle=grainPat;fgx.fillRect(0,0,fw,fh);
  fgx.globalAlpha=1;
  fgx.globalCompositeOperation='destination-in';fgx.drawImage(mkc,0,0);
  fgx.restore();
  const sm=ctx.imageSmoothingEnabled;ctx.imageSmoothingEnabled=false;
  ctx.drawImage(fgc,0,0,W,H);
  ctx.imageSmoothingEnabled=sm;
}
const coverH=new Image(),coverQ=new Image();
coverH.src=COVER_HOCH;coverQ.src=COVER_QUER;
function fitTitleCanvas(){
  // Am Desktop nur so groß wie die Spielfläche, am Handy bildschirmfüllend
  let w,h;
  if(innerWidth>700){
    w=Math.min(960,Math.round(innerWidth*0.94));
    h=Math.round(w/1.6);
    const maxH=Math.round(innerHeight*0.86);
    if(h>maxH){h=maxH;w=Math.round(h*1.6);}
  }else{
    w=Math.round(innerWidth);h=Math.round(innerHeight);
  }
  w=Math.max(320,w);h=Math.max(300,h);
  if(tcv.width!==w||tcv.height!==h){tcv.width=w;tcv.height=h;tx.imageSmoothingEnabled=false;}
}
addEventListener('resize',fitTitleCanvas);

function drawTitleArt(t){
  fitTitleCanvas();
  const TW=tcv.width, TH=tcv.height, c=tx, wide=TW/TH>1.2;
  const U=Math.min(TW,TH)/700;
  // Gemaltes Cover als Bühne (cover-Zuschnitt, damit nichts verzerrt)
  const img=wide?coverQ:coverH;
  c.fillStyle='#0a0620';c.fillRect(0,0,TW,TH);
  if(img.complete&&img.naturalWidth){
    const sc=Math.max(TW/img.naturalWidth,TH/img.naturalHeight);
    const w=img.naturalWidth*sc,h=img.naturalHeight*sc;
    c.imageSmoothingEnabled=true;
    c.drawImage(img,(TW-w)/2,(TH-h)*(wide?0.5:0.34),w,h);
  }
  // Verlauf oben, damit der Titel sicher steht
  const g=c.createLinearGradient(0,0,0,TH*(wide?0.6:0.46));
  g.addColorStop(0,'rgba(8,5,24,0.72)');g.addColorStop(0.55,'rgba(8,5,24,0.34)');g.addColorStop(1,'rgba(8,5,24,0)');
  c.fillStyle=g;c.fillRect(0,0,TW,TH*(wide?0.6:0.46));
  // Vignette
  const v=c.createRadialGradient(TW/2,TH*0.55,Math.min(TW,TH)*0.25,TW/2,TH*0.55,Math.max(TW,TH)*0.75);
  v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(4,2,12,0.65)');
  c.fillStyle=v;c.fillRect(0,0,TW,TH);

  // ---------- Titel ----------
  const LEFT=Math.round(TW*(wide?0.07:0.08)), MAXW=TW*(wide?0.52:0.84);
  c.textBaseline='top';c.textAlign='left';
  const fit=(str,start,weight)=>{let px=start;
    do{c.font=weight+' '+px+'px Georgia,"Times New Roman",serif';px-=1;}
    while(c.measureText(str).width>MAXW&&px>10);return px+1;};
  const big=(str,y)=>{
    const px=fit(str,Math.round(130*U*1.4),'700');
    c.font='700 '+px+'px Georgia,"Times New Roman",serif';
    c.lineJoin='round';c.miterLimit=2;
    // Schlagschatten
    c.save();
    c.shadowColor='rgba(0,0,0,0.85)';c.shadowBlur=px*0.28;c.shadowOffsetY=px*0.06;
    c.strokeStyle='#0b0618';c.lineWidth=px*0.22;c.strokeText(str,LEFT,y);
    c.restore();
    // warmer Schein
    c.save();
    c.shadowColor='rgba(255,190,90,0.55)';c.shadowBlur=px*0.42;
    c.strokeStyle='rgba(120,70,20,0.9)';c.lineWidth=px*0.10;c.strokeText(str,LEFT,y);
    c.restore();
    // Füllung mit Metallverlauf
    const lg=c.createLinearGradient(0,y,0,y+px);
    lg.addColorStop(0,'#fffbe6');lg.addColorStop(0.30,'#ffe89a');
    lg.addColorStop(0.52,'#f2cf5c');lg.addColorStop(0.70,'#d9a52f');lg.addColorStop(1,'#f6dc84');
    c.fillStyle=lg;c.fillText(str,LEFT,y);
    // Glanzkante oben
    c.save();
    c.beginPath();c.rect(LEFT-px,y,MAXW+px*2,px*0.34);c.clip();
    c.fillStyle='rgba(255,255,255,0.55)';c.fillText(str,LEFT,y);
    c.restore();
    return px;
  };
  const y1=Math.round(TH*(wide?0.10:0.07));
  const h1=big('EIN DATE',y1);
  const h2=big('MIT LAUREN',y1+h1*0.94);
  // feine Zierlinie unter dem Titel
  const ly=y1+h1*0.94+h2*1.02;
  const lw=Math.min(MAXW,h1*4.4);
  c.fillStyle='rgba(246,224,106,0.75)';c.fillRect(LEFT,ly,lw,Math.max(2,U*3));
  c.fillStyle='rgba(246,224,106,0.25)';c.fillRect(LEFT,ly+Math.max(2,U*3),lw*0.6,Math.max(1,U*1.5));
  // Startaufforderung
  if(Math.sin(t/380)>0){
    const fs=Math.max(15,Math.round(24*U));
    c.font='700 '+fs+'px Georgia,"Times New Roman",serif';
    const s4=(TOUCH?'Tippen':'Klicken')+', um anzufangen';
    const w=c.measureText(s4).width;
    c.save();
    c.shadowColor='rgba(0,0,0,0.9)';c.shadowBlur=fs*0.8;
    c.fillStyle='rgba(8,4,20,0.55)';c.fillRect(TW/2-w/2-18,TH-fs*3.3,w+36,fs*1.9);
    c.restore();
    c.fillStyle='#fdf6e0';c.fillText(s4,TW/2-w/2,TH-fs*2.9);
  }
}

const TOUCH=matchMedia('(pointer:coarse)').matches;
/* Hochkant/Handy: Sprechtext als HTML-Band ÜBER der Szene — native Schärfe, Szene bleibt frei */
const MQ_SAY=matchMedia('(max-width:700px)');
let MOBILE_SAY=MQ_SAY.matches;
const syncSayMode=()=>{MOBILE_SAY=MQ_SAY.matches;};
try{MQ_SAY.addEventListener('change',syncSayMode);}catch(e){if(MQ_SAY.addListener)MQ_SAY.addListener(syncSayMode);}
addEventListener('resize',syncSayMode);
const $say=document.getElementById('say');
const BREATH_HINT=TOUCH
  ?'Halten = einatmen, loslassen = ausatmen — bleib im hellen Streifen'
  :'Gedrückt halten (Bild/LEERTASTE) = einatmen, loslassen = ausatmen — bleib im hellen Streifen';
const HOLD_HINT=TOUCH?'Retention — nicht tippen, bis der Balken voll ist'
                     :'Retention — nichts drücken, bis der Balken voll ist';
cv.addEventListener('contextmenu',e=>e.preventDefault());   // kein Long-Press-Menü beim Atmen
// Langes Halten beim Atmen darf keinen Text markieren (Touch-Selektion greift sonst aufs Sprech-Band über)
document.getElementById('say').addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('selectstart',e=>e.preventDefault());
const clearSel=()=>{const s=window.getSelection&&getSelection();if(s&&!s.isCollapsed)s.removeAllRanges();};

/* Alles zeichnet in Einheiten; PS skaliert sie auf echte Pixel (immer ganzzahlig). */
let PS=1;
const px=(x,y,w,h,c)=>{ctx.fillStyle=c;
  ctx.fillRect(Math.round(x*PS),Math.round(y*PS),Math.max(0,Math.round(w*PS)),Math.max(0,Math.round(h*PS)));};
const dot=(x,y,c)=>px(x,y,1,1,c);
const vgrad=(x,y,w,h,cols)=>{const s=h/cols.length;for(let i=0;i<cols.length;i++)px(x,y+i*s,w,Math.ceil(s)+1,cols[i]);};
/* Verlauf mit Dither-Naht (Schachbrett) statt harter Bänder — 90er-VGA-Look */
const dgrad=(x,y,w,h,cols)=>{
  const s=h/cols.length;
  for(let i=0;i<cols.length;i++){
    px(x,y+i*s,w,Math.ceil(s)+1,cols[i]);
    if(i){
      const yy=Math.round(y+i*s);
      for(let xx=x;xx<x+w;xx+=2){
        px(xx+(yy%2),yy-1,1,1,cols[i]);
        px(xx+((yy+1)%2),yy+1,1,1,cols[i-1]);
      }
    }
  }
};
/* Polygon in Einheiten — für die schiefen DOTT-Wände und Fluchtpunkt-Böden */
const poly=(pts,c)=>{ctx.fillStyle=c;ctx.beginPath();
  pts.forEach((p,i)=>{i?ctx.lineTo(p[0]*PS,p[1]*PS):ctx.moveTo(p[0]*PS,p[1]*PS);});
  ctx.closePath();ctx.fill();};

const SND={ac:null,master:null,on:true,breath:null,pad:null};
function audioInit(){
  if(SND.ac)return;
  const AC=window.AudioContext||window.webkitAudioContext; if(!AC)return;
  const ac=new AC(); const m=ac.createGain(); m.gain.value=0.16; m.connect(ac.destination);
  SND.ac=ac;SND.master=m;
}
function ready(){ if(!SND.on)return false; if(!SND.ac)audioInit();
  if(SND.ac&&SND.ac.state==='suspended')SND.ac.resume(); return !!SND.ac; }

function tone(freq,dur,type,vol,delay,glideTo){
  if(!ready())return;
  const ac=SND.ac,t0=ac.currentTime+(delay||0);
  const o=ac.createOscillator(),g=ac.createGain(),f=ac.createBiquadFilter();
  o.type=type||'sine';o.frequency.setValueAtTime(freq,t0);
  if(glideTo)o.frequency.exponentialRampToValueAtTime(glideTo,t0+dur);
  f.type='lowpass';f.frequency.value=2600;f.Q.value=0.6;
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(vol||0.1,t0+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(f);f.connect(g);g.connect(SND.master);
  o.start(t0);o.stop(t0+dur+0.05);
}

function breathStart(){
  if(!ready()||SND.breath)return;
  const ac=SND.ac;
  const buf=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*0.5;
  const src=ac.createBufferSource();src.buffer=buf;src.loop=true;
  const bp=ac.createBiquadFilter();bp.type='bandpass';bp.frequency.value=420;bp.Q.value=1.1;
  const g=ac.createGain();g.gain.value=0.0001;
  src.connect(bp);bp.connect(g);g.connect(SND.master);src.start();
  const o1=ac.createOscillator(),o2=ac.createOscillator(),pg=ac.createGain();
  o1.type='sine';o1.frequency.value=146.83;o2.type='sine';o2.frequency.value=220.5;
  pg.gain.value=0.0001;o1.connect(pg);o2.connect(pg);pg.connect(SND.master);o1.start();o2.start();
  SND.breath={src,bp,g};SND.pad={o1,o2,pg};
}
function breathStop(){
  if(!SND.breath||!SND.ac)return;
  const t=SND.ac.currentTime;
  SND.breath.g.gain.cancelScheduledValues(t);
  SND.breath.g.gain.setTargetAtTime(0.0001,t,0.15);
  SND.pad.pg.gain.setTargetAtTime(0.0001,t,0.2);
  const b=SND.breath,p=SND.pad;SND.breath=null;SND.pad=null;
  setTimeout(()=>{try{b.src.stop();p.o1.stop();p.o2.stop();}catch(e){}},800);
}
function breathUpdate(v,hold,inband){
  if(!SND.breath||!SND.ac)return;
  const t=SND.ac.currentTime;
  SND.breath.bp.frequency.setTargetAtTime(300+v*1500,t,0.08);
  SND.breath.g.gain.setTargetAtTime(hold?0.085:0.045,t,0.12);
  SND.pad.pg.gain.setTargetAtTime(inband?0.05:0.004,t,0.25);
}
$mute.onclick=()=>{
  SND.on=!SND.on;$mute.textContent=SND.on?'♪ AN':'♪ AUS';
  if(!SND.on){breathStop();if(SND.master)SND.master.gain.value=0;}
  else{audioInit();if(SND.master)SND.master.gain.value=0.16;}
};

function figure(cx,top,s,P,t,breath,sitting,phase,blinkOff,mood,age){
  PS=1;
  const R=(x,y,w,h,c)=>px(cx+x*s,top+y*s,w*s,h*s,c);
  const e=breath>0.58?1:0;                                  // Brust hebt sich
  const sway=Math.sin(t/1600+phase)>0?0:1;                  // sachtes Wiegen
  const cyc=(t+phase*1000)%4200;
  const mo=mood||'neutral';
  const a=age||0;
  const laughing=(mo==='laugh'&&a<3.4);
  const rolling=(mo==='roll'&&a<1.1);
  const scratching=(mo==='scratch'&&a<3.4);
  const blink=laughing?true:(!blinkOff&&(cyc<130||(cyc>1700&&cyc<1810)));
  // beim Lachen wippt der ganze Körper, der Kopf geht nach hinten
  const yb=sway+(laughing?(Math.sin(t/95)>0?0:1):0);
  const hb=laughing?-1:0;                                   // Kopf zurück

  /* ---- Körper ---- */
  const O='#160f26';                                        // Kontur wie im Vorbild
  if(sitting){
    R(0,52,44,14,O);
    R(3,55,38,9,P.pants); R(5,58,34,5,'#2a2a3e');
    R(1,60,42,5,P.pants); R(1,63,42,2,'#252537');
    R(4,52,8,5,P.skin); R(32,52,8,5,P.skin);                // Hände auf Knien
    R(4,52,8,1,'#ffe3c4'); R(32,52,8,1,'#ffe3c4');
    R(6,55,1,2,P.skinDk); R(8,55,1,2,P.skinDk);
    R(34,55,1,2,P.skinDk); R(36,55,1,2,P.skinDk);
  }else{
    // Stand-/Spielbein: rechtes Bein leicht versetzt = Pose statt Symmetrie
    R(12,54,10,15,O); R(21,55,10,15,O);
    R(14,55,7,13,P.pants); R(23,56,7,12,P.pants);
    R(14,55,7,1,'#454560'); R(23,56,7,1,'#454560');
    R(13,66,9,2,'#191922'); R(22,67,9,2,'#191922');
  }
  // Torso — Schulter breit, Taille schmal, Hüfte mittel (DOTT-Silhouette)
  R(8-e,32+yb-e,28+e*2,25,O);
  R(9-e,33+yb-e,26+e*2,8,P.top);                             // Schultern
  R(12-e,41+yb-e,20+e*2,8,P.top);                            // Taille
  R(10-e,49+yb-e,24+e*2,7,P.top);                            // Hüfte
  R(9-e,33+yb-e,26+e*2,2,P.topHi);
  R(10-e,53,24+e*2,2,P.topDk);
  R(13,36+yb-e,3,14,P.topHi);                                // Faltenlicht
  R(28,38+yb-e,3,11,P.topDk);
  // Arme — dunkler als Torso + Konturspalte dazwischen
  R(4,35+yb-e,7,19,O); R(33,35+yb-e,7,19,O);
  R(5,36+yb-e,5,17,P.topDk); R(34,36+yb-e,5,17,P.topDk);
  R(5,36+yb-e,5,1,P.top); R(34,36+yb-e,5,1,P.top);
  R(10,35+yb-e,1,18,O); R(33,35+yb-e,1,18,O);
  if(!sitting){ R(4,52,7,6,P.skin); R(33,52,7,6,P.skin);     // große DOTT-Hände
    R(4,52,7,1,'#ffe3c4'); R(33,52,7,1,'#ffe3c4');
    R(6,55,1,3,P.skinDk); R(8,55,1,3,P.skinDk);
    R(35,55,1,3,P.skinDk); R(37,55,1,3,P.skinDk); }
  // Hals
  R(18,28+yb,8,6,P.skinSh); R(19,28+yb,6,5,P.skin); R(18,33+yb,8,1,P.skinDk);

  const yh=yb+hb;                                            // Kopfhöhe

  /* ---- Haar hinten ---- */
  R(9,2+yh,26,36,O);
  R(11,4+yh,22,32,P.hairDk);
  R(11,4+yh,22,2,P.hairMid);
  R(10,10+yh,3,24,P.hairDk); R(31,10+yh,3,24,P.hairDk);

  /* ---- Kopf ---- */
  R(14,6+yh,16,20,P.skin);
  R(15,4+yh,14,3,P.skin);
  R(15,26+yh,14,2,P.skin);                                   // Kiefer
  R(17,28+yh,10,2,P.skin);                                   // Kinn
  R(17,29+yh,10,1,P.skinSh);
  R(14,6+yh,16,2,'#ffe6cc');                                 // Stirnlicht
  R(28,8+yh,2,18,P.skinSh);                                  // Schattenseite
  R(14,8+yh,1,16,P.skinSh);
  // Ohren
  R(12,15+yh,2,6,P.skin); R(30,15+yh,2,6,P.skin);
  R(12,17+yh,1,3,P.skinDk); R(31,17+yh,1,3,P.skinDk);

  /* ---- Haar vorne ---- */
  R(13,3+yh,18,5,P.hair);
  R(15,3+yh,11,2,P.hairHi);
  R(13,7+yh,4,4,P.hair); R(27,7+yh,4,4,P.hair);
  R(12,5+yh,3,26,P.hair); R(29,5+yh,3,26,P.hair);
  R(12,5+yh,1,24,P.hairMid); R(31,5+yh,1,24,P.hairMid);
  R(17,4+yh,1,4,P.hairMid); R(23,3+yh,1,4,P.hairMid);        // Strähnen
  R(13,20+yh,2,10,P.hairMid); R(29,22+yh,2,8,P.hairMid);

  /* ---- Gesicht ---- */
  // Brauen
  let bl0=12,br0=12;
  if(laughing){bl0=10;br0=10;}
  else if(rolling||mo==='roll'){bl0=10;br0=10;}
  else if(scratching){bl0=10;br0=13;}                        // eine hoch, eine runter
  R(16,bl0+yh,5,1,P.hairDk); R(23,br0+yh,5,1,P.hairDk);
  R(16,bl0+yh,2,1,P.hairMid); R(26,br0+yh,2,1,P.hairMid);

  // Augen
  if(laughing){                                              // Lachfältchen, Augen zu
    R(16,15+yh,5,1,P.lash); R(23,15+yh,5,1,P.lash);
    R(16,14+yh,1,1,P.lash); R(20,14+yh,1,1,P.lash);
    R(23,14+yh,1,1,P.lash); R(27,14+yh,1,1,P.lash);
    R(15,17+yh,2,1,P.skinDk); R(28,17+yh,2,1,P.skinDk);
  }else if(blink){
    R(16,16+yh,5,1,P.lash); R(23,16+yh,5,1,P.lash);
  }else{
    // Blickrichtung: Augenrollen fährt einmal oben herum
    let ox=0,oy=0;
    if(rolling){
      const p=a/1.1;
      ox=p<0.33?-1:p<0.66?0:1; oy=-1;
    }else if(mo==='roll'){ oy=0; }
    else if(scratching){ ox=1; oy=0; }
    R(16,14+yh,5,4,P.white); R(23,14+yh,5,4,P.white);
    R(17,14+yh,3,4,P.iris);  R(24,14+yh,3,4,P.iris);
    R(18+ox,15+yh+oy,2,3+(oy?-1:0),P.pupil); R(25+ox,15+yh+oy,2,3+(oy?-1:0),P.pupil);
    if(!oy){R(17,15+yh,1,1,'#ffffff'); R(24,15+yh,1,1,'#ffffff');}
    R(16,13+yh,5,1,P.lash);  R(23,13+yh,5,1,P.lash);
    R(16,18+yh,5,1,P.skinSh); R(23,18+yh,5,1,P.skinSh);
  }
  // Nase
  R(21,17+yh,2,4,P.skinSh); R(21,21+yh,3,1,P.skinDk);
  R(20,21+yh,1,1,P.skinDk); R(23,21+yh,1,1,P.skinDk);
  // Mund
  if(laughing){                                              // offener Lachmund
    R(18,23+yh,8,5,'#5a2630');
    R(19,23+yh,6,1,'#f6f2ec');                               // Zähne
    R(20,26+yh,4,1,'#c4606a');                               // Zunge
    R(17,23+yh,1,1,P.lip); R(26,23+yh,1,1,P.lip);
  }else if(mo==='roll'){
    R(19,24+yh,7,1,P.lip); R(19,25+yh,1,1,P.lip);            // schmal, links runter
  }else if(mo==='scratch'){
    R(19,24+yh,6,1,P.lip); R(20,25+yh,4,1,P.lipHi); R(25,24+yh,1,1,P.skinDk);
  }else{
    R(18,24+yh,8,1,P.lip); R(19,25+yh,6,1,P.lipHi); R(20,23+yh,4,1,P.skinSh);
  }
  // Wangen
  R(15,20+yh,3,2,P.blush); R(26,20+yh,3,2,P.blush);
  if(laughing){ R(15,19+yh,4,3,P.blush); R(25,19+yh,4,3,P.blush); }
  // Bart (Jonas)
  if(P.beard){
    R(15,25+yh,14,4,P.beard); R(17,29+yh,10,2,P.beard);
    R(18,24+yh,8,1,P.lip); R(19,25+yh,6,1,P.lipHi);
    R(15,25+yh,14,1,P.hairMid);
  }

  /* ---- Am Kopf kratzen ---- */
  if(scratching){
    const j=Math.sin(t/110)>0?0:1;
    R(34,36+yb-e,5,8,P.top);                                 // Oberarm
    R(32,26+yh-j,5,13,P.top);                                // Unterarm hoch
    R(32,26+yh-j,5,1,P.topHi);
    R(29,20+yh-j,7,7,P.skin);                                // Hand am Hinterkopf
    R(29,20+yh-j,7,1,'#ffe3c4');
    R(30,24+yh-j,1,3,P.skinDk); R(32,24+yh-j,1,3,P.skinDk); R(34,24+yh-j,1,3,P.skinDk);
  }
  PS=1;
}

/* ================= Figuren V2 — echte DOTT-Proportionen =================
   Riesenkopf (~1/3 Körper), dünner Hals, Wespentaille, Riesenhände/-füße,
   asymmetrische Pose (Hand in der Hüfte, Standbein/Spielbein).
   Überschreibt die alte figure()-Deklaration. Raster 48 x 92 (stehend) / 48 x 66 (sitzend). */
function figure(cx,top,s,P,t,breath,sitting,phase,blinkOff,mood,age,talking,walking){
  PS=1;
  const R=(x,y,w,h,c)=>px(cx+x*s,top+y*s,w*s,h*s,c);
  const O='#12091e';
  const e=breath>0.58?1:0;
  const sway=Math.sin(t/1600+phase)>0?0:1;
  const cyc=(t+phase*1000)%4200;
  const mo=mood||'neutral';
  const a=age||0;
  const laughing=(mo==='laugh'&&a<3.4);
  const rolling=(mo==='roll'&&a<1.1);
  const scratching=(mo==='scratch'&&a<3.4);
  const blink=laughing?true:(!blinkOff&&(cyc<130||(cyc>1700&&cyc<1810)));
  const yb=sway+(laughing?(Math.sin(t/95)>0?0:1):0);
  const yh=yb+(laughing?-2:0);
  const ty=sitting?30:33;                    // Torso-Oberkante

  if(sitting){
    /* Schneidersitz */
    R(2,54+yb,44,13,O);
    R(4,56+yb,40,7,P.pants); R(2,61+yb,44,4,P.pants); R(2,64+yb,44,2,'#20202f');
    R(4,50+yb,10,8,O); R(34,50+yb,10,8,O);                    // Riesenhände auf Knien
    R(5,51+yb,8,6,P.skin); R(35,51+yb,8,6,P.skin);
    R(5,51+yb,8,1,'#ffe3c4'); R(35,51+yb,8,1,'#ffe3c4');
    R(7,54+yb,1,3,P.skinDk); R(10,54+yb,1,3,P.skinDk);
    R(37,54+yb,1,3,P.skinDk); R(40,54+yb,1,3,P.skinDk);
    /* Torso mit Taille */
    R(13,29+yb-e,22,26+e,O);
    R(14,30+yb-e,20,9+e,P.top);
    R(17,38+yb,14,8,P.top);
    R(15,45+yb,18,9,P.top);
    R(14,30+yb-e,20,2,P.topHi);
    R(16,33+yb,3,16,P.topHi); R(29,34+yb,3,14,P.topDk);
    /* Arme zu den Knien */
    R(9,32+yb-e,6,19,O); R(10,33+yb-e,4,17,P.topDk);
    R(33,32+yb-e,6,19,O); R(34,33+yb-e,4,17,P.topDk);
  }else{
    /* Beine — lang, dünn; beim Gehen wechselnder Schritt */
    const wk=walking?(Math.sin(t/130)>0?2:0):0;
    const wk2=walking?(2-wk):0;
    R(16,58,9,28,O); R(25,59,9,28,O);
    R(17,59-wk,7,26,P.pants); R(26,60-wk2,7,26,P.pants);
    R(17,59-wk,2,26,'#4a4a68'); R(26,60-wk2,2,26,'#4a4a68');
    /* Riesenschuhe */
    R(10-wk,84-wk,15,7,O); R(25+wk2,86-wk2,15,7,O);
    R(11-wk,85-wk,13,5,'#1c1c28'); R(26+wk2,87-wk2,13,5,'#1c1c28');
    R(11-wk,85-wk,13,1,'#3c3c52'); R(26+wk2,87-wk2,13,1,'#3c3c52');
    if(P.stout){
      /* Jonas: Fass-Torso mit Bauch statt Taille */
      R(11,32-e+yb,26,29+e,O);
      R(12,33-e+yb,24,27+e,P.top);
      R(12,33-e+yb,24,2,P.topHi);
      R(10,44,28,13,O); R(11,45,26,11,P.top);
      R(11,53,26,2,P.topDk);
      R(14,36+yb,3,16,P.topHi); R(31,38+yb,3,14,P.topDk);
    }else{
      /* Hüfte + A-Linie */
      R(13,51,22,10,O);
      R(14,52,20,8,P.top);
      R(11,56,26,6,O); R(12,57,24,4,P.top); R(12,59,24,2,P.topDk);
      /* Wespentaille */
      R(15,43,18,10,O); R(16,44,16,8,P.top);
      R(17,44,3,8,P.topHi);
      /* Brustkorb/Schultern */
      R(12,32-e+yb,24,13+e,O);
      R(13,33-e+yb,22,11+e,P.top);
      R(13,33-e+yb,22,2,P.topHi);
      R(15,36+yb,3,8,P.topHi); R(30,37+yb,3,7,P.topDk);
    }
    /* Linker Arm — hängt mit leichtem Bogen, Riesenhand */
    R(8,34-e+yb,6,13,O); R(9,35-e+yb,4,11,P.topDk);
    R(6,45,6,12,O); R(7,46,4,10,P.topDk);
    R(3,55,10,9,O); R(4,56,8,7,P.skin); R(4,56,8,1,'#ffe3c4');
    R(6,60,1,3,P.skinDk); R(9,60,1,3,P.skinDk);
    /* Rechter Arm — Hand in der Hüfte (entfällt beim Kratzen) */
    if(!scratching){
      R(34,34-e+yb,6,11,O); R(35,35-e+yb,4,9,P.topDk);
      R(35,43,7,6,O); R(36,44,5,4,P.topDk);
      R(31,47,9,8,O); R(32,48,7,6,P.skin);
      R(32,48,7,1,'#ffe3c4');
    }
  }

  /* Hals — dünn */
  R(20,ty-5+yb,8,6,O); R(21,ty-5+yb,6,5,P.skinSh); R(22,ty-5+yb,4,4,P.skin);

  /* Haar hinten */
  if(P.bun){
    /* Jonas: kurzer Schopf + Dutt */
    R(8,0+yh,32,16,O);
    R(9,1+yh,30,14,P.hairDk);
    R(18,-6+yh,12,8,O); R(19,-5+yh,10,6,P.hair); R(20,-5+yh,4,2,P.hairHi);
  }else{
    /* Lauren: große Masse bis auf die Schultern */
    R(7,0+yh,34,ty+9,O);
    R(8,1+yh,32,ty+7,P.hairDk);
    R(8,1+yh,32,3,P.hairMid);
  }

  /* Kopf — riesig */
  R(10,2+yh,28,28,O);
  R(11,3+yh,26,26,P.skin);
  R(13,2+yh,22,2,P.skin);
  R(14,28+yh,20,3,P.skin); R(16,30+yh,16,2,P.skin);
  R(11,3+yh,26,2,'#ffe6cc');
  R(34,5+yh,3,22,P.skinSh); R(11,6+yh,2,20,P.skinSh);
  /* Ohren */
  R(8,14+yh,3,8,O); R(37,14+yh,3,8,O);
  R(9,15+yh,2,6,P.skin); R(37,15+yh,2,6,P.skin);

  /* Haar vorne */
  R(9,0+yh,30,7,P.hair);
  R(11,0+yh,22,2,P.hairHi);
  R(15,6+yh,3,2,P.hairMid); R(22,5+yh,3,3,P.hairMid); R(30,6+yh,3,2,P.hairMid); // Pony-Zacken
  if(P.bun){
    R(8,4+yh,4,10,P.hair); R(36,4+yh,4,10,P.hair);   // kurze Koteletten
  }else{
    /* Säulen enden auf Wangenhöhe, fallen dann HINTER die Schulter (kein "Bart") */
    R(4,16+yh,6,ty-8,O); R(38,16+yh,6,ty-8,O);
    R(8,4+yh,4,16,P.hair); R(36,4+yh,4,16,P.hair);
    R(8,4+yh,1,14,P.hairMid); R(39,4+yh,1,14,P.hairMid);
    R(6,18+yh,4,8,P.hair); R(38,18+yh,4,8,P.hair);
    R(5,24+yh,4,ty-16,P.hairDk); R(39,24+yh,4,ty-16,P.hairDk);
    R(9,15+yh,2,6,P.hairMid); R(37,16+yh,2,6,P.hairMid);
  }
  if(P.band){ R(9,7+yh,30,3,P.band); R(9,7+yh,30,1,'#e89a5c'); }   // Stirnband

  /* Gesicht — große Züge */
  const bl0=(laughing||rolling)?9:scratching?9:11;
  const br0=scratching?12:bl0;
  R(14,bl0+yh,7,2,O); R(27,br0+yh,7,2,O);
  if(laughing){
    R(14,15+yh,7,2,O); R(27,15+yh,7,2,O);
    R(13,13+yh,2,2,O); R(20,13+yh,2,2,O);
    R(26,13+yh,2,2,O); R(33,13+yh,2,2,O);
  }else if(blink){
    R(14,16+yh,7,2,O); R(27,16+yh,7,2,O);
  }else{
    let ox=0,oy=0;
    if(rolling){const p=a/1.1;ox=p<0.33?-1:p<0.66?0:1;oy=-1;}
    else if(scratching){ox=1;}
    R(13,12+yh,8,8,O); R(26,12+yh,8,8,O);
    R(14,13+yh,6,6,P.white); R(27,13+yh,6,6,P.white);
    R(15+ox,13+yh+oy,4,6,P.iris); R(28+ox,13+yh+oy,4,6,P.iris);
    R(16+ox,15+yh+oy,2,3,P.pupil); R(29+ox,15+yh+oy,2,3,P.pupil);
    R(15,14+yh,1,1,'#ffffff'); R(28,14+yh,1,1,'#ffffff');
  }
  /* Knollennase */
  R(22,18+yh,4,5,P.skinSh); R(21,22+yh,6,2,P.skinDk);
  /* Mund — breit */
  if(laughing){
    R(15,24+yh,18,6,O);
    R(16,25+yh,16,4,'#5a2630');
    R(17,25+yh,14,1,'#f6f2ec');
    R(20,28+yh,8,1,'#c4606a');
  }else if(mo==='roll'){
    R(17,26+yh,12,2,O); R(17,28+yh,2,1,O);
  }else if(mo==='scratch'){
    R(18,26+yh,10,2,P.lip); R(28,25+yh,2,2,P.skinDk);
  }else if(talking&&Math.sin(t/130)>0){
    R(16,24+yh,15,5,O);                          // Lip-Flap beim Sprechen
    R(17,25+yh,13,3,'#5a2630');
    R(18,25+yh,11,1,'#f6f2ec');
  }else{
    R(16,25+yh,15,2,P.lip); R(18,27+yh,11,1,P.lipHi);
  }
  R(11,20+yh,4,3,P.blush); R(33,20+yh,4,3,P.blush);
  if(laughing){R(10,19+yh,5,4,P.blush);R(33,19+yh,5,4,P.blush);}
  /* Bart (Jonas) */
  if(P.beard){
    R(12,24+yh,24,6,P.beard); R(14,29+yh,20,3,P.beard);
    R(16,25+yh,15,2,P.lip);
  }
  /* Rimlight — warmes Kantenlicht von oben rechts */
  R(35,5+yh,2,20,'rgba(255,224,170,0.28)');
  R(33,33-e+yb,2,10,'rgba(255,224,170,0.20)');
  if(!sitting)R(32,52,2,7,'rgba(255,224,170,0.16)');
  /* Am Kopf kratzen */
  if(scratching){
    const j=Math.sin(t/110)>0?0:1;
    const ab=sitting?32:34;
    R(ab,34-e+yb,6,10,O); R(ab+1,35-e+yb,4,8,P.topDk);
    R(37,18+yh-j,6,18,O); R(38,19+yh-j,4,16,P.topDk);
    R(33,11+yh-j,10,9,O); R(34,12+yh-j,8,7,P.skin);
    R(35,15+yh-j,1,3,P.skinDk); R(38,15+yh-j,1,3,P.skinDk);
  }
  PS=1;
}

/* ================= Figuren V3 — Kurven statt Klötze =================
   Vektor-Cartoon: runder Kopf mit Bob, Sanduhr-Torso, Stroke-Gliedmaßen
   mit runden Kappen, Riesenhände. Überschreibt figure() erneut.
   Einheitenraum 48 x ~92 (stehend) / 48 x ~70 (sitzend). */
function figure(cx,top,s,P,t,breath,sitting,phase,blinkOff,mood,age,talking,walking,prop,face,socks){
  const O='#12091e';
  const m=(face<0?-1:1), fx=(face||0)*3.2;      // Dreiviertel-Blick: Gesicht rückt zur Blickseite
  const mo=mood||'neutral', a=age||0;
  let chewing=false;
  const laughing=(mo==='laugh'&&a<3.4);
  const rolling=(mo==='roll'&&a<1.1);
  const scratching=(mo==='scratch'&&a<3.4);
  const medi=(mo==='medi');                       // meditiert: Augen zu, Atem sichtbar
  const cyc=(t+phase*1000)%4200;
  const blink=(laughing||medi)?true:(!blinkOff&&(cyc<130||(cyc>1700&&cyc<1810)));
  const sway=Math.sin(t/1500+phase)*0.6;
  const bounce=laughing?(Math.sin(t/95)>0?0:1.2):0;
  const c=ctx;
  c.save(); c.translate(cx,top); c.scale(s,s);
  c.lineJoin='round'; c.lineCap='round';

  const F=fill=>{c.fillStyle=fill;c.fill();c.strokeStyle=O;c.lineWidth=1.15;c.stroke();};
  const limb=(pts,w,col)=>{
    c.beginPath();c.moveTo(pts[0][0],pts[0][1]);
    for(let i=1;i<pts.length;i+=2)c.quadraticCurveTo(pts[i][0],pts[i][1],pts[i+1][0],pts[i+1][1]);
    c.strokeStyle=O;c.lineWidth=w+2;c.stroke();
    c.strokeStyle=col;c.lineWidth=w;c.stroke();
  };
  const hand=(x,y,r)=>{
    c.beginPath();c.ellipse(x,y,r,r*0.92,0,0,7);F(P.skin);
    c.strokeStyle=P.skinDk;c.lineWidth=0.6;
    c.beginPath();c.moveTo(x-r*0.35,y+r*0.35);c.lineTo(x-r*0.35,y+r*0.72);
    c.moveTo(x+r*0.15,y+r*0.4);c.lineTo(x+r*0.15,y+r*0.75);c.stroke();
  };

  const HX=24;
  const shY=(sitting?32:33)-(breath-0.5)*2.4+sway*0.3;   // Schulterlinie atmet

  /* ---------- Unterbau ---------- */
  if(sitting){
    c.beginPath();
    c.moveTo(2,66);c.quadraticCurveTo(4,52,16,52);
    c.lineTo(32,52);c.quadraticCurveTo(44,52,46,66);
    c.quadraticCurveTo(24,70,2,66);c.closePath();F(P.pants);
    // angedeutete überkreuzte Schienbeine — kein "Rock"-Kegel mehr
    limb([[11,60.5],[24,55.5],[37,61.5]],4.2,P.pants);
    limb([[37,60],[24,55],[11,61]],4.2,P.pants);
  }else{
    const swing=walking?Math.sin(t/130)*4:0;
    limb([[19,56],[18,70],[18+swing*0.4,84]],6.5,P.pants);
    limb([[29,56],[30,70],[30-swing*0.4,84]],6.5,P.pants);
    if(socks){                                     // Schuhe sind aus — Sockenfüße
      c.beginPath();c.ellipse(15+swing*0.4,87.5,6.8,3.1,0,0,7);F(P.sockCol||'#e8e4da');
      c.beginPath();c.ellipse(33-swing*0.4,88.5,6.8,3.1,0,0,7);F(P.sockCol||'#e8e4da');
      if(P.sneaker){                               // Kevins berühmtes Loch — "damit der Zeh was sieht"
        c.fillStyle=P.skin;c.beginPath();c.ellipse(18.5+swing*0.4,86.6,1.5,1.1,0,0,7);c.fill();
      }
      if(P.bun){                                   // Jonas' berühmte Zehensocken
        c.strokeStyle='#c8703c';c.lineWidth=1;
        c.beginPath();c.moveTo(10,86.4);c.lineTo(12,88.6);c.moveTo(13.4,86);c.lineTo(15.4,88.2);c.moveTo(16.8,86.2);c.lineTo(18.4,88);c.stroke();
        c.beginPath();c.moveTo(28,87.4);c.lineTo(30,89.6);c.moveTo(31.4,87);c.lineTo(33.4,89.2);c.moveTo(34.8,87.2);c.lineTo(36.4,89);c.stroke();
      }
    }else{
    c.beginPath();c.ellipse(15+swing*0.4,87.5,8.2,3.6,0,0,7);F(P.sneaker||'#1c1c28');
    c.beginPath();c.ellipse(33-swing*0.4,88.5,8.2,3.6,0,0,7);F(P.sneaker||'#1c1c28');
    if(P.sneaker&&!socks){                                 // weiße Sneaker: dunkle Streifen + Sohle
      c.strokeStyle='#3a3a44';c.lineWidth=0.8;
      c.beginPath();c.moveTo(11+swing*0.4,86.6);c.lineTo(14+swing*0.4,88.6);
      c.moveTo(14+swing*0.4,86.2);c.lineTo(17+swing*0.4,88.2);c.stroke();
      c.beginPath();c.moveTo(29-swing*0.4,87.6);c.lineTo(32-swing*0.4,89.6);
      c.moveTo(32-swing*0.4,87.2);c.lineTo(35-swing*0.4,89.2);c.stroke();
      c.fillStyle='#b8b8c0';
      c.fillRect(7.5+swing*0.4,89.6,15,1.2);c.fillRect(25.5-swing*0.4,90.6,15,1.2);
    }
    }
  }

  /* ---------- Torso ---------- */
  c.beginPath();
  if(P.stout){
    c.moveTo(HX-13,shY);
    c.quadraticCurveTo(HX-17,shY+12,HX-14,(sitting?52:56));
    c.quadraticCurveTo(HX,(sitting?58:62),HX+14,(sitting?52:56));
    c.quadraticCurveTo(HX+17,shY+12,HX+13,shY);
    c.quadraticCurveTo(HX,shY-3,HX-13,shY);
  }else if(P.straight){
    // Kevin: gerader Männer-Torso, Hemd fällt locker — keine Taille
    c.moveTo(HX-12,shY);
    c.quadraticCurveTo(HX-13.5,shY+14,HX-12.5,(sitting?53:60));
    c.lineTo(HX+12.5,(sitting?53:60));
    c.quadraticCurveTo(HX+13.5,shY+14,HX+12,shY);
    c.quadraticCurveTo(HX,shY-3,HX-12,shY);
  }else{
    c.moveTo(HX-12,shY);
    c.quadraticCurveTo(HX-13,shY+8,HX-7,shY+14);
    c.quadraticCurveTo(HX-15,(sitting?48:54),HX-13,(sitting?53:60));
    c.lineTo(HX+13,(sitting?53:60));
    c.quadraticCurveTo(HX+15,(sitting?48:54),HX+7,shY+14);
    c.quadraticCurveTo(HX+13,shY+8,HX+12,shY);
    c.quadraticCurveTo(HX,shY-3,HX-12,shY);
  }
  c.closePath();F(P.top);
  c.beginPath();c.moveTo(HX-8,shY+2);c.quadraticCurveTo(HX-10,shY+10,HX-6,shY+16);
  c.strokeStyle=P.topHi;c.lineWidth=2;c.stroke();
  if(P.jacket){
    // Offene Jacke über dem Top — zwei Seitenpaneele + Kragen
    const hem=sitting?52:58;
    c.beginPath();c.moveTo(HX-12.5,shY+0.5);
    c.quadraticCurveTo(HX-14.5,shY+12,HX-13,hem);
    c.lineTo(HX-7.5,hem);
    c.quadraticCurveTo(HX-9,shY+12,HX-8,shY+1.5);
    c.closePath();F(P.jacket);
    c.beginPath();c.moveTo(HX+12.5,shY+0.5);
    c.quadraticCurveTo(HX+14.5,shY+12,HX+13,hem);
    c.lineTo(HX+7.5,hem);
    c.quadraticCurveTo(HX+9,shY+12,HX+8,shY+1.5);
    c.closePath();F(P.jacket);
    c.beginPath();c.moveTo(HX-8,shY+0.5);c.lineTo(HX-3.5,shY+4.5);c.lineTo(HX-8.5,shY+6.5);c.closePath();F(P.jacketDk);
    c.beginPath();c.moveTo(HX+8,shY+0.5);c.lineTo(HX+3.5,shY+4.5);c.lineTo(HX+8.5,shY+6.5);c.closePath();F(P.jacketDk);
  }
  if(P.stout){
    c.beginPath();c.ellipse(HX,shY+16,9,7,0,0,7);
    c.fillStyle='rgba(0,0,0,0.08)';c.fill();
  }
  if(P.tee){
    // Offenes Hemd: T-Shirt-Ausschnitt + Goldkette + Medaille
    c.beginPath();c.moveTo(HX-5,shY+0.5);c.lineTo(HX+5,shY+0.5);c.lineTo(HX,shY+11);c.closePath();F(P.tee);
    c.strokeStyle='#d8b04a';c.lineWidth=0.9;
    c.beginPath();c.moveTo(HX-4,shY+1.5);c.quadraticCurveTo(HX,shY+6.5,HX+4,shY+1.5);c.stroke();
    if(P.medal){
      c.strokeStyle='#b83a30';c.lineWidth=1.4;
      c.beginPath();c.moveTo(HX-4.6,shY+1);c.lineTo(HX-1,shY+10);c.moveTo(HX+4.6,shY+1);c.lineTo(HX+1,shY+10);c.stroke();
      c.beginPath();c.arc(HX,shY+12.5,3,0,7);F('#a06a34');
      c.strokeStyle='#6e441c';c.lineWidth=0.8;
      c.beginPath();c.arc(HX,shY+12.5,1.6,0,7);c.stroke();
    }
  }

  /* ---------- Arme + Requisit in der Hand ---------- */
  const drawProp=(hx,hyy)=>{
    if(prop==='riegel'||prop==='bar'){
      c.save();c.translate(hx,hyy);c.rotate(prop==='bar'?-0.9:-0.5);
      c.beginPath();c.rect(-3,-13,6,15);F(prop==='bar'?'#2a2620':'#6a3a1c');   // ungeöffnet: dunkle Koro-Folie
      c.fillStyle=prop==='bar'?'#d8d2c4':'#c8a03c';c.fillRect(-3,-13,6,5.5);
      c.fillStyle=prop==='bar'?'#8a8478':'#4e2a14';c.fillRect(-3,-7,6,1.4);
      c.restore();
    }else if(prop==='phone'){
      c.save();c.translate(hx+3,hyy-8);c.rotate(-0.35);
      c.beginPath();c.rect(-3.2,-7,6.4,13);F('#101018');
      c.fillStyle='#9ad8f0';c.fillRect(-2.3,-5.6,4.6,9.6);
      c.fillStyle='#d8f2fc';c.fillRect(-1.6,-4.6,3.2,1.2);
      c.restore();
    }else if(prop==='bottle'){
      c.save();c.translate(hx,hyy);
      c.beginPath();c.rect(-3.4,-19,6.8,20);F('#4e2415');          // braune Glasflasche
      c.fillStyle='rgba(255,255,255,0.18)';c.fillRect(-2.6,-18,1.4,18);
      c.fillStyle='#e8dcc0';c.fillRect(-3.4,-12,6.8,6.2);          // Etikett
      c.fillStyle='#c8462e';c.fillRect(-3.4,-12,6.8,1.8);          // rotes Band
      c.fillStyle='#c8462e';c.fillRect(-3.4,-7.4,6.8,1.2);
      c.fillStyle='#3a2a24';c.fillRect(-1.7,-23.6,3.4,5);          // Flaschenhals
      c.fillStyle='#e8c45a';c.fillRect(-1.7,-24.4,3.4,1.2);        // Kronkorken
      c.restore();
    }
  };
  if(sitting){
    limb([[HX-11,shY+3],[HX-17,shY+13],[9,48]],4.6,P.jacket||P.topDk);
    hand(9,51,5.2);
    if(!scratching){ limb([[HX+11,shY+3],[HX+17,shY+13],[39,48]],4.6,P.jacket||P.topDk); hand(39,51,5.2); }
  }else{
    if(prop==='riegel'&&Math.sin(t/850)>0.1){
      // Sie beißt ab — Arm und Riegel werden erst NACH dem Kopf gezeichnet,
      // sonst verschwindet beides hinter dem Riesenkopf (siehe unten bei chewing)
      chewing=true;
    }else{
      limb([[HX-11,shY+3],[HX-17,shY+13],[HX-15,55]],4.6,P.jacket||P.topDk);
      hand(HX-15,60,5.6);
      drawProp(HX-15,58);                        // Requisit VOR der Hand — sie hält es sichtbar
      if(prop){c.fillStyle=P.skin;c.beginPath();c.ellipse(HX-15,58.5,2.4,1.7,0.35,0,7);c.fill();}
    }
    if(!scratching){
      limb([[HX+11,shY+3],[HX+21,shY+10],[HX+17,49]],4.6,P.jacket||P.topDk);
      hand(HX+15,51,4.6);
    }
  }

  /* ---------- Kopf ---------- */
  const hy=sway*0.5-bounce+(laughing?-1.5:0);
  if(P.cap){

    c.beginPath();c.ellipse(HX,-3.5+hy,6,4.4,0,0,7);F(P.hair);
  }else{
    // Bob mit Welle: liegt an der Wange an, schwingt unten nach außen
    c.beginPath();
    c.moveTo(HX-17,7+hy);

    c.quadraticCurveTo(HX-20,32+hy,HX-13,31+hy);
    c.quadraticCurveTo(HX-7,34+hy,HX,31.5+hy);
    c.quadraticCurveTo(HX+7,34+hy,HX+13,31+hy);
    c.quadraticCurveTo(HX+20,32+hy,HX+17,26+hy);
    c.quadraticCurveTo(HX+21,17+hy,HX+17,7+hy);
    c.quadraticCurveTo(HX,-6+hy,HX-17,7+hy);
    c.closePath();F(P.hairDk);
    c.strokeStyle=P.hairMid;c.lineWidth=1;
    c.beginPath();c.moveTo(HX-15,12+hy);c.quadraticCurveTo(HX-17,20+hy,HX-14,27+hy);c.stroke();
    c.beginPath();c.moveTo(HX+15,12+hy);c.quadraticCurveTo(HX+17,20+hy,HX+14,27+hy);c.stroke();
  }
  c.fillStyle=P.skin;c.fillRect(HX-2.6,shY-8.5,5.2,9.5);     // ganz normaler Hals: Hautfarbe, kein Kasten
  c.fillStyle='rgba(0,0,0,0.10)';c.fillRect(HX-2.6,shY-8.5,5.2,1.8);
  c.beginPath();c.ellipse(HX,17+hy,14.5,15.5,0,0,7);F(P.skin);
  c.beginPath();c.ellipse(HX,26+hy,9.5,7,0,0,7);c.fillStyle=P.skin;c.fill();
  // Nur das hintere Ohr ist sichtbar (Dreiviertel-Ansicht)
  if((face||0)>=0){c.beginPath();c.ellipse(HX-15.5,18+hy,2.4,3.4,0,0,7);F(P.skin);}
  if((face||0)<=0){c.beginPath();c.ellipse(HX+15.5,18+hy,2.4,3.4,0,0,7);F(P.skin);}
  if(!P.bun&&!P.cap){                                        // Goldohrring am sichtbaren Ohr
    c.fillStyle='#e8c45a';
    const eaX=(face||0)>0?HX-16:HX+16;
    c.beginPath();c.arc(eaX,22.5+hy,1.8,0,7);c.fill();
    c.fillStyle='#fff2c0';c.beginPath();c.arc(eaX-0.5,22+hy,0.6,0,7);c.fill();
  }
  // Pony mit Bögen
  if(P.cap){
    // Baseball-Cap mit Schirm in Blickrichtung
    c.beginPath();c.moveTo(HX-15,9+hy);

    c.quadraticCurveTo(HX+16,-3+hy,HX+15,9+hy);
    c.quadraticCurveTo(HX,5.5+hy,HX-15,9+hy);c.closePath();F(P.cap);
    c.beginPath();c.ellipse(HX+m*13,8.8+hy,9.5,2.8,m*0.16,0,7);F(P.cap);
    c.fillStyle='#e8e8ee';c.fillRect(HX-4+fx*0.4,0.2+hy,8,3.4);   // "GOOD VIBES"-Patch

    c.fillRect(HX-2.8+fx*0.4,1.2+hy,1.3,1.5);c.fillRect(HX-0.6+fx*0.4,1.2+hy,1.3,1.5);c.fillRect(HX+1.6+fx*0.4,1.2+hy,1.3,1.5);
  }else{

    c.moveTo(HX-15,10+hy);

  const exL=HX-6+fx, exR=HX+6+fx, ey=15+hy, MX=HX+fx;

  if(laughing){

      c.beginPath();c.ellipse(ex+ox,ey+oy,2.0,2.6,0,0,7);c.fillStyle=P.iris;c.fill();

  if(P.glasses){                                             // getönte Brille über den Augen

  c.strokeStyle=P.skinDk;c.lineWidth=1.1;
  c.beginPath();c.moveTo(MX+0.5*m,ey+2);c.quadraticCurveTo(MX+2.4*m,ey+5,MX+0.2*m,ey+6.4);c.stroke();
  if(P.stubble){                                             // Dreitagebart

  const my=ey+9.6;

  }else if(medi){

    else{c.strokeStyle=P.lip;c.lineWidth=1.6;

    c.beginPath();c.ellipse(MX,my+0.6,4.4,2.8,0,0,7);F('#5a2630');

  }else if(mo==='scratch'){
    c.strokeStyle='#a24e5e';c.lineWidth=1.5;
    c.beginPath();c.moveTo(MX-4.4,my);c.quadraticCurveTo(MX+1,my+1.8,MX+4.6,my-0.8);c.stroke();
  }else{
    c.strokeStyle=P.lip;c.lineWidth=1.7;
    c.beginPath();c.moveTo(MX-5,my-0.6);c.quadraticCurveTo(MX,my+2.4,MX+5,my-0.6);c.stroke();
  }
  c.fillStyle='rgba(230,140,120,0.42)';
  c.beginPath();c.ellipse(HX-9.5+fx*0.7,ey+5.5,2.6,1.6,0,0,7);c.fill();
  c.beginPath();c.ellipse(HX+9.5+fx*0.7,ey+5.5,2.6,1.6,0,0,7);c.fill();

  if(scratching){
    const j=Math.sin(t/110)*1.2;
    limb([[HX+11,shY+3],[HX+27,shY-10],[HX+18,3+hy+j]],4.6,P.jacket||P.topDk);
    hand(HX+17,1.5+hy+j,4.6);
  }

  // Riegel zum Mund führen — vor dem Gesicht, damit man das Abbeißen sieht
  if(chewing){
    const mox=HX+fx, moy=ey+9.6, hax=mox-9.5, hay=moy+9.5;
    limb([[HX-11,shY+3],[HX-19,shY+13],[hax,hay]],4.6,P.jacket||P.topDk);

    c.save();c.translate(hax,hay);c.rotate(0.77);

    c.fillStyle='#4e2a14';c.fillRect(-3,-12,6,1.4);

  }

  /* Rimlight */
  c.strokeStyle='rgba(255,224,170,0.5)';c.lineWidth=1.1;
  c.beginPath();c.moveTo(HX+10,5+hy);c.quadraticCurveTo(HX+15,14+hy,HX+12.5,24+hy);c.stroke();
  c.restore();
}

/* ================= Szenen (320x200-Koordinaten, PS=1.5) ================= */
/* DOTT-Optik: nichts steht gerade. Wände kippen, Böden fluchten, Licht fällt in Kegeln. */

function starsIn(t,x0,x1,y0,y1,mul){
  for(const s of stars){if(s.x<x0||s.x>x1||s.y<y0||s.y>y1)continue;
    const tw=.5+.5*Math.sin(t/420+s.b*9),v=((mul||170)*tw)|0;dot(s.x,s.y,`rgb(${v},${v},${v+30})`);}
}
/* Dielenfugen, die auf einen Fluchtpunkt zulaufen */
function floorSeams(vpx,yTop,col){
  for(let x=-40;x<=360;x+=36){
    const tx=vpx+(x-vpx)*0.22;
    poly([[x,200],[x+3,200],[tx+1,yTop],[tx,yTop]],col);
  }
}
/* Rot gestreifter Teppich in Perspektive — wie im Vorbild */
function rug(cx,yTop,wTop,yBot,wBot){
  poly([[cx-wTop/2,yTop],[cx+wTop/2,yTop],[cx+wBot/2,yBot],[cx-wBot/2,yBot]],'#8c2320');
  for(let i=0;i<6;i++){
    const a=i/6,b=(i+0.55)/6;
    const y1=yTop+(yBot-yTop)*a,y2=yTop+(yBot-yTop)*b;
    const w1=wTop+(wBot-wTop)*a,w2=wTop+(wBot-wTop)*b;
    poly([[cx-w1/2,y1],[cx+w1/2,y1],[cx+w2/2,y2],[cx-w2/2,y2]],i%2?'#b3502c':'#6e1a1a');
  }
  for(let f=-wBot/2+3;f<wBot/2-3;f+=8)px(cx+f,yBot-1,3,3,'#c9a44a');
}

function sceneFront(t){
  drawBG(bgFront,0.55);
  starsIn(t,0,320,0,30,150);
  PS=1;                         // das Rad zeichnet die Malschicht (siehe frame)
}

/* ================= Figuren als Pixel-Sprites =================
   Ein gemaltes Sprite je Figur und Haltung. Bewegt wird es wie in den
   Adventures der 90er: Kopf und Körper sind getrennte Teile (Atmen, Nicken),
   Augen und Mund sind vorbereitete Varianten desselben Bildes, die
   pixelgenau darüberpassen (Blinzeln, Sprechen). */
const SPRM={   // hand = die beiden Handmittelpunkte, aus den Sprites ausgemessen
  lst:{w:50,h:102,hals:39,hand:[[14,63],[36,63]]}, lsi:{w:66,h:76,hals:38,hand:[[21,49],[44,49]]}, lme:{w:68,h:80,hals:39},
  kst:{w:47,h:103,hals:40,hand:[[13,75],[33,76]]}, ksi:{w:71,h:82,hals:31,hand:[[18,60],[53,60]]}, kme:{w:73,h:96,hals:41},
  jst:{w:54,h:108,hals:42,hand:[[15,66],[37,66]]}, jsi:{w:66,h:71,hals:33,hand:[[19,48],[46,48]]}, jme:{w:77,h:90,hals:45},
  // Gestenpose: gleicher Rahmen wie die Stehpose, nur der Körper hat eine Hand oben
  lge:{w:50,h:102,hals:39}, kge:{w:47,h:103,hals:40}
};
const SPR={};
for(const k of Object.keys(SPRM)){
  SPR[k]=new Image();SPR[k].src='bilder/sprites/'+k+'.png';
  if(k.endsWith('st')||k.endsWith('si')||k==='jme')for(const v of ['b','t1','t2']){
    SPR[k+v]=new Image();SPR[k+v].src='bilder/sprites/'+k+v+'.png';
  }
}
const sprBereit=k=>SPR[k]&&SPR[k].complete&&SPR[k].naturalWidth>0;

/* who: 'l'|'k'|'j' · pose: 'st' stehend · 'si' sitzend · 'me' sitzend, meditierend
   cx = Mitte, fuss = Standlinie, o = {breath,talking,phase,tilt,prop,walk} */
function spriteFig(who,pose,cx,fuss,S,t,o){
  o=o||{};
  const key=who+pose, m=SPRM[key];
  if(!m||!sprBereit(key))return false;
  const cyc=(t+(o.phase||0)*1000)%4300;
  const blink=(pose!=='me')&&(cyc<150||(cyc>2100&&cyc<2210));
  let bild=key;
  if(o.talking&&sprBereit(key+'t1'))      bild=key+(Math.floor(t/115)%2?'t2':'t1');
  else if(blink&&sprBereit(key+'b'))      bild=key+'b';
  const img=SPR[bild]||SPR[key];
  // Beim Reden gestikuliert die Hand: der KÖRPER kommt dann aus der Gestenpose,
  // der KOPF bleibt der mit Mund und Augen — beide Bilder liegen deckungsgleich.
  const gesteKey=who+'ge';
  const gestikuliert=o.talking&&pose==='st'&&sprBereit(gesteKey)&&(Math.floor(t/2100)%2===0);
  const rumpf=gestikuliert?SPR[gesteKey]:img;

  const br=(o.breath===undefined)?0.5+0.5*Math.sin(t/1500):o.breath;
  const dy=br>0.55?1:0;                       // ein Pixel Atem — mehr braucht es nicht
  const w=m.w,h=m.h,hals=m.hals;
  const bx=Math.round(cx-w*S/2), by=Math.round(fuss-h*S);
  const wippe=o.walk?Math.round(Math.abs(Math.sin(t/150))*1.4):0;

  ctx.save();
  const sm=ctx.imageSmoothingEnabled;ctx.imageSmoothingEnabled=false;
  // Körper — staucht sich beim Ausatmen, die Füße bleiben stehen
  ctx.drawImage(rumpf,0,hals,w,h-hals, bx,by+(hals+dy-wippe)*S, w*S,(h-hals-dy+wippe)*S);
  // Kopf — eigenes Teil, deshalb nickt und neigt er
  const neig=(o.tilt===undefined?Math.sin(t/2600)*0.016:o.tilt);
  const hx=bx+w*S/2, hy=by+(hals+dy-wippe)*S;
  ctx.translate(hx,hy);ctx.rotate(neig);ctx.translate(-hx,-hy);
  ctx.drawImage(img,0,0,w,hals, bx,by+(dy-wippe)*S, w*S,hals*S);
  ctx.restore();
  ctx.imageSmoothingEnabled=sm;

  if(o.prop&&m.hand){                          // Requisit in die Hand, nicht an die Hüfte
    const seite=gestikuliert?0:(o.propSide==='l'?0:1);
    const [hxp,hyp]=m.hand[seite];
    drawPropAt(o.prop, bx+hxp*S, by+(hyp+dy)*S, S);
  }
  return true;
}

/* Kevins E-Bike — in Szenen-Einheiten, wiederverwendbar (abgestellt oder fahrend) */
function drawEBike(dx,dy,sc,roll,lamp){
  ctx.save();ctx.scale(1.5,1.5);ctx.translate(dx,dy);if(sc!==1)ctx.scale(sc,sc);
  const bY=165, w1=17, w2=71, R=12.5;
  ctx.lineCap='round';
  // Reifen
  ctx.strokeStyle='#15111f';ctx.lineWidth=3.4;
  ctx.beginPath();ctx.arc(w1,bY,R,0,7);ctx.stroke();
  ctx.beginPath();ctx.arc(w2,bY,R,0,7);ctx.stroke();
  // Felgen + ein paar Speichen
  ctx.strokeStyle='#4a4568';ctx.lineWidth=1;
  ctx.beginPath();ctx.arc(w1,bY,R-2.8,0,7);ctx.stroke();
  ctx.beginPath();ctx.arc(w2,bY,R-2.8,0,7);ctx.stroke();
  ctx.strokeStyle='rgba(120,116,158,0.42)';ctx.lineWidth=0.5;
  for(let a=0;a<6;a++){const an=a*Math.PI/3+(roll||0);
    ctx.beginPath();ctx.moveTo(w1,bY);ctx.lineTo(w1+Math.cos(an)*(R-3),bY+Math.sin(an)*(R-3));ctx.stroke();
    ctx.beginPath();ctx.moveTo(w2,bY);ctx.lineTo(w2+Math.cos(an)*(R-3),bY+Math.sin(an)*(R-3));ctx.stroke();}
  // Rahmen (Tiefeinsteiger, wie ein Trekking-E-Bike)
  const bb={x:44,y:158};            // Tretlager
  ctx.strokeStyle='#2f8079';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(24,141);ctx.lineTo(bb.x,bb.y);ctx.stroke();          // Unterrohr, tief eingezogen
  ctx.beginPath();ctx.moveTo(bb.x,bb.y);ctx.lineTo(56,140);ctx.stroke();          // Sattelrohr
  ctx.beginPath();ctx.moveTo(24,141);ctx.lineTo(56,140);ctx.stroke();             // Oberrohr
  ctx.beginPath();ctx.moveTo(bb.x,bb.y);ctx.lineTo(w2,bY);ctx.stroke();           // Kettenstrebe
  ctx.beginPath();ctx.moveTo(56,140);ctx.lineTo(w2,bY);ctx.stroke();              // Sitzstrebe
  // Akku im Unterrohr — das E am E-Bike
  ctx.strokeStyle='#1e2c44';ctx.lineWidth=4.4;
  ctx.beginPath();ctx.moveTo(28,145);ctx.lineTo(40,153.5);ctx.stroke();
  ctx.strokeStyle='#7fd8c8';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(30,146.6);ctx.lineTo(37.5,152);ctx.stroke();
  // Mittelmotor + Kurbel
  ctx.fillStyle='#2a3550';ctx.beginPath();ctx.arc(bb.x,bb.y,4.4,0,7);ctx.fill();
  ctx.strokeStyle='#5a6a90';ctx.lineWidth=1;ctx.beginPath();ctx.arc(bb.x,bb.y,4.4,0,7);ctx.stroke();
  ctx.strokeStyle='#8c93b4';ctx.lineWidth=1.4;
  ctx.beginPath();ctx.moveTo(bb.x,bb.y);ctx.lineTo(bb.x+5,bb.y+4);ctx.stroke();
  // Gabel + Steuerrohr
  ctx.strokeStyle='#2f8079';ctx.lineWidth=2.6;
  ctx.beginPath();ctx.moveTo(w1,bY);ctx.lineTo(24,141);ctx.stroke();
  ctx.beginPath();ctx.moveTo(24,141);ctx.lineTo(26,134);ctx.stroke();
  // Lenker mit Griffen + Display
  ctx.strokeStyle='#1d1a2c';ctx.lineWidth=2.2;
  ctx.beginPath();ctx.moveTo(18,133);ctx.lineTo(34,135);ctx.stroke();
  ctx.strokeStyle='#4a4a62';ctx.lineWidth=3;
  ctx.beginPath();ctx.moveTo(18,133);ctx.lineTo(21.5,133.4);ctx.stroke();
  ctx.beginPath();ctx.moveTo(31,134.6);ctx.lineTo(34,135);ctx.stroke();
  ctx.fillStyle='#0e1420';ctx.fillRect(24,128.5,6.4,4.4);
  ctx.fillStyle='#8fe6d2';ctx.fillRect(24.9,129.4,4.6,2.6);
  // Sattel + Sattelstütze
  ctx.strokeStyle='#4a4a62';ctx.lineWidth=1.8;
  ctx.beginPath();ctx.moveTo(56,140);ctx.lineTo(58,132);ctx.stroke();
  ctx.fillStyle='#1d1a2c';
  ctx.beginPath();ctx.ellipse(58,131,6,2.6,-0.08,0,7);ctx.fill();
  // Gepäckträger hinten
  ctx.strokeStyle='#4a4a62';ctx.lineWidth=1.4;
  ctx.beginPath();ctx.moveTo(58,136);ctx.lineTo(w2+7,138);ctx.stroke();
  ctx.beginPath();ctx.moveTo(w2+7,138);ctx.lineTo(w2+3,bY-6);ctx.stroke();
  // Frontlicht (+ Lichtkegel nur beim abgestellten Rad vor dem Studio)
  ctx.fillStyle='#ffe9a8';ctx.fillRect(17.5,137.5,2.6,2.4);
  if(lamp){
    ctx.fillStyle='rgba(255,233,168,0.10)';
    ctx.beginPath();ctx.moveTo(18,140);ctx.lineTo(0,164);ctx.lineTo(0,178);ctx.lineTo(21,168);ctx.closePath();ctx.fill();
  }
  // Schatten unter den Rädern
  ctx.fillStyle='rgba(8,5,16,0.50)';
  ctx.beginPath();ctx.ellipse(w1,bY+11,9.5,2.8,0,0,7);ctx.fill();
  ctx.beginPath();ctx.ellipse(w2,bY+11,9.5,2.8,0,0,7);ctx.fill();
  ctx.fillStyle='rgba(8,5,16,0.26)';
  ctx.beginPath();ctx.ellipse((w1+w2)/2,bY+12,34,3.4,0,0,7);ctx.fill();
  ctx.restore();
  PS=1;
}

/* Das Hinge-Foto ist dieselbe Figur, die man gleich im Raum sitzen sieht —
   dasselbe Sprite, gemalte Kulisse dahinter. */
function renderPortrait(who,w,h,mode,bg){
  const off=document.createElement('canvas');off.width=w;off.height=h;
  const oc=off.getContext('2d');
  if(bg&&bg.complete&&bg.naturalWidth){
    oc.save();oc.filter='blur('+((mode==='circle')?3:5)+'px) brightness('+((mode==='circle')?0.88:0.66)+') saturate(0.92)';
    const s=Math.max(w/bg.naturalWidth,h/bg.naturalHeight);
    const bw=bg.naturalWidth*s, bh=bg.naturalHeight*s;
    oc.drawImage(bg,(w-bw)/2,(h-bh)*0.42,bw,bh);
    oc.restore();
  }else{
    const grd=oc.createLinearGradient(0,0,0,h);
    grd.addColorStop(0,'#3a2d5e');grd.addColorStop(1,'#5b4a86');
    oc.fillStyle=grd;oc.fillRect(0,0,w,h);
  }
  const key=who+'st', m=SPRM[key];
  if(m&&sprBereit(key)){
    // Kreis: nur der Kopf. Karte: Kopf und Oberkörper, wie ein Selfie von schräg unten.
    const zeig=(mode==='circle')?Math.round(m.hals*1.05):Math.round(m.hals*1.9);
    const S=h/zeig, dx=(w-m.w*S)/2, dy=(mode==='circle')?-m.hals*0.06*S:0;
    oc.imageSmoothingEnabled=false;
    oc.drawImage(SPR[key],0,0,m.w,zeig, dx,dy, m.w*S, zeig*S);
  }
  return off.toDataURL();
}

function wrapT(s,max){const o=[];let l='';for(const w of s.split(' ')){if((l+w).length>max){o.push(l.trim());l='';}l+=w+' ';}if(l.trim())o.push(l.trim());return o;}
function drawSay(segs,yTop,ax){
  if(!segs||!segs.length)return;
  PS=1;
  ctx.font='bold 13px ui-monospace,"Courier New",monospace';
  const CW=ctx.measureText('M').width, MAX=Math.floor((W-24)/CW);
  // Jedes Segment auf eigene Zeilen: Erzähltes grau, Rede mit Namen in Sprecherfarbe
  const rows=[];let lastName=null;
  for(const g of segs){
    const showName=g.speak&&g.name&&g.name!==lastName;
    if(g.speak)lastName=g.name;else lastName=null;
    const raw=(g.speak?(showName?g.name+': ':'')+g.text:g.text).replace(/\s+/g,' ').trim();
    if(!raw)continue;
    for(const ln of wrapT(raw,MAX))rows.push({text:ln,col:g.col,speak:g.speak});
  }
  const cx0=(ax===undefined)?W/2:ax;
  let y=yTop;
  // Abdunkeln, damit der Text auch über hellen Bildstellen lesbar bleibt
  let bx=6;
  if(rows.length){
    let maxW=0;for(const r of rows)maxW=Math.max(maxW,r.text.length*CW);
    const bw=Math.min(W-8,maxW+20);
    bx=Math.round(Math.max(4,Math.min(W-4-bw,cx0-bw/2)));
    px(bx,yTop-6,Math.round(bw),rows.length*15+11,'rgba(6,4,16,0.74)');
    px(bx,yTop-6,Math.round(bw),1,'rgba(255,255,255,0.07)');
  }
  for(const r of rows){
    ctx.font=(r.speak?'bold 13px':'13px')+' ui-monospace,"Courier New",monospace';
    ctx.textBaseline='top';
    const x=bx+10;                        // alle Zeilen bündig im Band
    ctx.fillStyle='#000';
    for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++)if(dx||dy)ctx.fillText(r.text,x+dx,y+dy);
    ctx.fillStyle=r.col;ctx.fillText(r.text,x,y);
    y+=15;
  }
}

const COL_OF={l:'#f0b8c8',j:'#e0c27a',k:'#9ac0f0',n:'#b8b8cc'};
function line(who,txt){
  const t=(txt||'').trim();
  // Eine Zeile kann Erzähltext UND Rede enthalten. Statt sie einfarbig zu machen,
  // wird sie in Segmente zerlegt: Erzähltes grau-kursiv, Gesprochenes in Sprecherfarbe.
  S.who=who;
  S.segs=speechSegments(t,who);
  S.narr=!S.segs.some(g=>g.speak);
  S.full=t;
  S.col=COL_OF[who]||COL_OF.n;
  S.shown=0;S.typing=true;S.pause=0;
}
/* Zerlegt "Sie kramt. \"Anzahlung.\"" in [{erzählt},{gesprochen}] */
function speechSegments(t,who){
  const out=[];
  const re=/["»„]([^"«“]*)["«“]/g;
  let last=0,m,cur=who;
  while((m=re.exec(t))){
    const before=t.slice(last,m.index);
    if(before){
      const nm=/(^|[\s—–-])(Sie|Er|Du|Lauren|Kevin|Jonas)\s*:\s*$/.exec(before);
      if(nm){
        cur=({'Sie':'l','Lauren':'l','Du':'k','Kevin':'k','Er':'j','Jonas':'j'})[nm[2]]||who;
        const head=before.slice(0,nm.index+(nm[1]?nm[1].length:0));
        if(head.trim())out.push({text:head,speak:false});
      }else{
        out.push({text:before,speak:false});
        cur=who;
      }
    }
    out.push({text:m[0],speak:true,who:cur});
    last=re.lastIndex;
  }
  const rest=t.slice(last);
  if(rest)out.push({text:rest,speak:false});
  if(!out.length)out.push({text:t,speak:false});
  return out;
}
/* Segmente bis zur getippten Zeichenzahl kürzen */
function sayHTMLFrom(list){
  const esc=x=>x.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  let lastN=null;
  return list.map(g=>{
    const t=g.text.replace(/\s+/g,' ').trim();
    if(!t)return '';
    const showN=g.speak&&g.name&&g.name!==lastN;
    lastN=g.speak?g.name:null;
    return '<div style="color:'+g.col+(g.speak?';font-weight:700':';font-style:italic;opacity:.92')+'">'
           +(showN?esc(g.name)+': ':'')+esc(t)+'</div>';
  }).join('');
}
function fullSayHTML(){return sayHTMLFrom(visibleSegs(1e9));}
function visibleSegs(n){
  const out=[];let left=n;
  for(const g of (S.segs||[])){
    if(left<=0)break;
    const txt=g.text.slice(0,left);
    const w=g.who||S.who;
    out.push({text:txt,col:g.speak?(COL_OF[w]||COL_OF.n):COL_OF.n,speak:!!g.speak,
              name:g.speak?({l:'Lauren',k:'Kevin',j:'Jonas'})[w]:null});
    left-=g.text.length;
  }
  return out;
}
function beat(who,txt,list,hint){S.mood='neutral';S.moodT=0;line(who,txt);opts(list,hint);}

}

}
function waveWon(){
  const i=S.run.wave;S.mode='talk';

function waveLost(){

const down=e=>{

  if(S.mode==='tram'&&S.tram&&!S.tram.done){
    // Skip springt zur ABFAHRT, nicht ans Ende — Einfahren + Einsteigen bleiben immer sichtbar
    if(performance.now()-S.tram.t0>1200)S.tram.t0=Math.min(S.tram.t0,performance.now()-6600);
    if(e&&e.cancelable)e.preventDefault();return;}
  if(S.mode==='play'&&S.run){S.run.hold=true;skipTyping();if(e&&e.cancelable)e.preventDefault();return;}
  if(S.mode==='hold'&&S.retn&&!S.retn.broke){S.retn.broke=true;if(e&&e.cancelable)e.preventDefault();return;}
  if(skipTyping()){if(e&&e.cancelable)e.preventDefault();return;}
  // Ein Klick ins Bild reicht, solange es nur einen Weg weiter gibt
  if(S.pending&&S.pending.length===1&&!S.typing){
    const only=S.pending[0];S.pending=null;$ch.innerHTML='';only.go();
  }
  if(e&&e.cancelable)e.preventDefault();
};
