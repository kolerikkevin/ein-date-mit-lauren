<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Breathwork mit Lauren — ein Date</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕯️</text></svg>">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:#000;color:#e8e8f0;
    font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Courier New",monospace;
    display:flex;align-items:center;justify-content:center;padding:14px;
    -webkit-font-smoothing:none;
  }
  #frame{width:100%;max-width:960px}
  canvas{
    display:block;width:100%;height:auto;
    image-rendering:pixelated;image-rendering:crisp-edges;
    background:#000;border:2px solid #16162a;cursor:pointer;
    touch-action:none;user-select:none;
  }
  #ui{background:#07070f;border:2px solid #16162a;border-top:none;padding:9px 12px 11px;min-height:132px}
  #hint{color:#7a7aa8;font-size:11px;letter-spacing:.6px;margin-bottom:7px;text-transform:uppercase}
  ul{list-style:none}
  li{padding:3px 6px 3px 18px;position:relative;cursor:pointer;font-size:14px;line-height:1.45;color:#cfc2e8}
  li:before{content:"›";position:absolute;left:4px;color:#3a3a6a}
  li:hover{color:#ffe066}
  li:hover:before{color:#ffe066}
  #stats{display:flex;gap:20px;align-items:center;margin-top:9px;padding-top:8px;
         border-top:1px solid #16162a;font-size:11px;color:#7a7aa8;letter-spacing:.5px}
  #stats b{color:#e8e8f0;font-weight:normal}
  #mute{margin-left:auto;background:none;border:1px solid #26264a;color:#7a7aa8;
        font:inherit;font-size:11px;padding:2px 8px;cursor:pointer;letter-spacing:.5px}
  #mute:hover{color:#ffe066;border-color:#5a5a2a}
  li{-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  @media (max-width:700px){
    body{padding:0;align-items:flex-start}
    #frame{max-width:none}
    canvas{border-left:none;border-right:none}
    #ui{padding:8px 10px 10px;min-height:0;border-left:none;border-right:none}
    #hint{font-size:10px;margin-bottom:5px}
    li{font-size:15px;line-height:1.4;padding:9px 6px 9px 20px}
    li:before{top:9px}
    li{position:relative}
    #stats{font-size:10px;margin-top:6px;padding-top:6px}
  }
</style>
</head>
<body>
<div id="frame">
  <canvas id="c" width="480" height="300"></canvas>
  <div id="ui">
    <div id="hint">…</div>
    <ul id="choices"></ul>
    <div id="stats"><span id="sline"></span><button id="mute" type="button">♪ AN</button></div>
  </div>
</div>
<script>
(() => {
"use strict";

const W=480,H=300;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;
const $ch=document.getElementById('choices'),$hint=document.getElementById('hint'),
      $sline=document.getElementById('sline'),$mute=document.getElementById('mute');
const TOUCH=matchMedia('(pointer:coarse)').matches;
const BREATH_HINT=TOUCH
  ?'Finger aufs Bild gedrückt halten = einatmen · loslassen = ausatmen'
  :BREATH_HINT;
cv.addEventListener('contextmenu',e=>e.preventDefault());   // kein Long-Press-Menü beim Atmen

/* Alles zeichnet in Einheiten; PS skaliert sie auf echte Pixel (immer ganzzahlig). */
let PS=1;
const px=(x,y,w,h,c)=>{ctx.fillStyle=c;
  ctx.fillRect(Math.round(x*PS),Math.round(y*PS),Math.max(0,Math.round(w*PS)),Math.max(0,Math.round(h*PS)));};
const dot=(x,y,c)=>px(x,y,1,1,c);
const vgrad=(x,y,w,h,cols)=>{const s=h/cols.length;for(let i=0;i<cols.length;i++)px(x,y+i*s,w,Math.ceil(s)+1,cols[i]);};
/* Verlauf mit Dither-Naht (Schachbrett) statt harter Bänder — 90er-VGA-Look */
const dgrad=(x,y,w,h,cols)=>{
  const s=h/cols.length;
  for(let i=0;i<cols.length;i++){
    px(x,y+i*s,w,Math.ceil(s)+1,cols[i]);
    if(i){
      const yy=Math.round(y+i*s);
      for(let xx=x;xx<x+w;xx+=2){
        px(xx+(yy%2),yy-1,1,1,cols[i]);
        px(xx+((yy+1)%2),yy+1,1,1,cols[i-1]);
      }
    }
  }
};
/* Polygon in Einheiten — für die schiefen DOTT-Wände und Fluchtpunkt-Böden */
const poly=(pts,c)=>{ctx.fillStyle=c;ctx.beginPath();
  pts.forEach((p,i)=>{i?ctx.lineTo(p[0]*PS,p[1]*PS):ctx.moveTo(p[0]*PS,p[1]*PS);});
  ctx.closePath();ctx.fill();};

/* ================= Sound ================= */
const SND={ac:null,master:null,on:true,breath:null,pad:null};
function audioInit(){
  if(SND.ac)return;
  const AC=window.AudioContext||window.webkitAudioContext; if(!AC)return;
  const ac=new AC(); const m=ac.createGain(); m.gain.value=0.16; m.connect(ac.destination);
  SND.ac=ac;SND.master=m;
}
function ready(){ if(!SND.on)return false; if(!SND.ac)audioInit();
  if(SND.ac&&SND.ac.state==='suspended')SND.ac.resume(); return !!SND.ac; }

function tone(freq,dur,type,vol,delay,glideTo){
  if(!ready())return;
  const ac=SND.ac,t0=ac.currentTime+(delay||0);
  const o=ac.createOscillator(),g=ac.createGain(),f=ac.createBiquadFilter();
  o.type=type||'sine';o.frequency.setValueAtTime(freq,t0);
  if(glideTo)o.frequency.exponentialRampToValueAtTime(glideTo,t0+dur);
  f.type='lowpass';f.frequency.value=2600;f.Q.value=0.6;
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(vol||0.1,t0+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(f);f.connect(g);g.connect(SND.master);
  o.start(t0);o.stop(t0+dur+0.05);
}
const SFX={
  good(){tone(587.33,0.42,'sine',0.11);tone(880,0.55,'sine',0.085,0.09);tone(1174.66,0.5,'sine',0.032,0.17);},
  ok(){tone(440,0.34,'sine',0.09);tone(659.25,0.32,'sine',0.04,0.06);},
  meh(){tone(311.13,0.30,'triangle',0.085);tone(293.66,0.34,'triangle',0.05,0.05);},
  bad(){tone(196,0.55,'sawtooth',0.05,0,138.59);tone(103,0.6,'sine',0.085);},
  page(){tone(1046.5,0.08,'sine',0.03);},
  blip(){tone(1380,0.022,'square',0.014);},
  start(){tone(174.61,1.6,'sine',0.055);tone(261.63,1.4,'sine',0.028,0.1);},
  win(){tone(659.25,0.5,'sine',0.10);tone(987.77,0.7,'sine',0.07,0.11);tone(1318.5,0.8,'sine',0.03,0.22);},
  lose(){tone(110,0.8,'sine',0.10,0,73);tone(146,0.5,'triangle',0.04);},
  end(){tone(392,0.7,'sine',0.09);tone(587.33,0.9,'sine',0.07,0.16);tone(783.99,1.4,'sine',0.05,0.34);},
  endBad(){tone(146.83,1.6,'sine',0.10,0,110);}
};
function breathStart(){
  if(!ready()||SND.breath)return;
  const ac=SND.ac;
  const buf=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*0.5;
  const src=ac.createBufferSource();src.buffer=buf;src.loop=true;
  const bp=ac.createBiquadFilter();bp.type='bandpass';bp.frequency.value=420;bp.Q.value=1.1;
  const g=ac.createGain();g.gain.value=0.0001;
  src.connect(bp);bp.connect(g);g.connect(SND.master);src.start();
  const o1=ac.createOscillator(),o2=ac.createOscillator(),pg=ac.createGain();
  o1.type='sine';o1.frequency.value=146.83;o2.type='sine';o2.frequency.value=220.5;
  pg.gain.value=0.0001;o1.connect(pg);o2.connect(pg);pg.connect(SND.master);o1.start();o2.start();
  SND.breath={src,bp,g};SND.pad={o1,o2,pg};
}
function breathStop(){
  if(!SND.breath||!SND.ac)return;
  const t=SND.ac.currentTime;
  SND.breath.g.gain.cancelScheduledValues(t);
  SND.breath.g.gain.setTargetAtTime(0.0001,t,0.15);
  SND.pad.pg.gain.setTargetAtTime(0.0001,t,0.2);
  const b=SND.breath,p=SND.pad;SND.breath=null;SND.pad=null;
  setTimeout(()=>{try{b.src.stop();p.o1.stop();p.o2.stop();}catch(e){}},800);
}
function breathUpdate(v,hold,inband){
  if(!SND.breath||!SND.ac)return;
  const t=SND.ac.currentTime;
  SND.breath.bp.frequency.setTargetAtTime(300+v*1500,t,0.08);
  SND.breath.g.gain.setTargetAtTime(hold?0.085:0.045,t,0.12);
  SND.pad.pg.gain.setTargetAtTime(inband?0.05:0.004,t,0.25);
}
$mute.onclick=()=>{
  SND.on=!SND.on;$mute.textContent=SND.on?'♪ AN':'♪ AUS';
  if(!SND.on){breathStop();if(SND.master)SND.master.gain.value=0;}
  else{audioInit();if(SND.master)SND.master.gain.value=0.16;}
};

/* ================= Sternenfeld ================= */
const stars=[];(()=>{let s=8123;const r=()=>(s=(s*1103515245+12345)&0x7fffffff)/0x7fffffff;
  for(let i=0;i<90;i++)stars.push({x:(r()*320)|0,y:(r()*110)|0,b:r()});})();
function moon(x,y,r){
  // Echte Sichel mit Glow statt weißem Klotz
  ctx.save();ctx.translate(x*PS,y*PS);ctx.scale(PS,PS);
  ctx.fillStyle='rgba(255,250,215,0.06)';
  ctx.beginPath();ctx.arc(0,0,r*1.55,0,7);ctx.fill();
  ctx.fillStyle='#efe9cc';
  ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fill();
  ctx.fillStyle='rgba(12,10,44,0.92)';
  ctx.beginPath();ctx.arc(r*0.5,-r*0.25,r*0.92,0,7);ctx.fill();
  ctx.restore();
}

/* ================= Figuren, fein ================= */
/* Raster 44 x 68 Einheiten. s = Pixel pro Einheit. */
const LAUREN={
  skin:'#f7d7b8',skinSh:'#e2b995',skinDk:'#c99a78',blush:'#eaa896',
  hair:'#e5ca80',hairHi:'#f9e9b4',hairMid:'#cdaf66',hairDk:'#a78a49',
  top:'#c96a86',topHi:'#e28ea6',topDk:'#9d4a64',
  white:'#f6f2ec',iris:'#4e8a86',pupil:'#1a1620',lash:'#3a2a24',
  lip:'#c46f7d',lipHi:'#dd949c',pants:'#33334a',beard:null,
  jacket:'#3f8f86',jacketDk:'#2c6e63',sockCol:'#3a3a52'
};
/* Kevin — nach Referenzbild: Cap, orange Brille, blaues Hemd offen, Chinos, weiße Sneaker */
const KEVFIG={
  skin:'#e8c09a',skinSh:'#d0a67e',skinDk:'#b78a60',blush:'#d8a084',
  hair:'#e2c268',hairHi:'#f2dc94',hairMid:'#c4a24e',hairDk:'#a08038',
  top:'#3f6aa8',topHi:'#5c88c4',topDk:'#2e5288',
  white:'#f2eee6',iris:'#4e7ab0',pupil:'#1a1620',lash:'#3a2a20',
  lip:'#a86a58',lipHi:'#c08a76',pants:'#d8cbaa',pantsHi:'#e8dcc0',
  cap:'#16161e',stubble:1,tee:'#eae4d8',sneaker:'#ececec',straight:1,sockCol:'#7fa8d0'
};
const JONAS={
  skin:'#ecc3a4',skinSh:'#d4a888',skinDk:'#b98d6c',blush:'#d59a86',
  hair:'#b59464',hairHi:'#cdb083',hairMid:'#9c7c4e',hairDk:'#7d6238',
  top:'#cbb78d',topHi:'#e3d2ac',topDk:'#a5926c',
  white:'#f2eee6',iris:'#6a7a5a',pupil:'#1a1620',lash:'#4a3a28',
  lip:'#b98a7a',lipHi:'#cba392',pants:'#8a7a5a',beard:'#8d7048',
  bun:1,stout:1,band:'#c8703c',sockCol:'#b8a888'  // eigenes Rig: Dutt, Stirnband, Bauch statt Taille
};

function figure(cx,top,s,P,t,breath,sitting,phase,blinkOff,mood,age){
  PS=1;
  const R=(x,y,w,h,c)=>px(cx+x*s,top+y*s,w*s,h*s,c);
  const e=breath>0.58?1:0;                                  // Brust hebt sich
  const sway=Math.sin(t/1600+phase)>0?0:1;                  // sachtes Wiegen
  const cyc=(t+phase*1000)%4200;
  const mo=mood||'neutral';
  const a=age||0;
  const laughing=(mo==='laugh'&&a<3.4);
  const rolling=(mo==='roll'&&a<1.1);
  const scratching=(mo==='scratch'&&a<3.4);
  const blink=laughing?true:(!blinkOff&&(cyc<130||(cyc>1700&&cyc<1810)));
  // beim Lachen wippt der ganze Körper, der Kopf geht nach hinten
  const yb=sway+(laughing?(Math.sin(t/95)>0?0:1):0);
  const hb=laughing?-1:0;                                   // Kopf zurück

  /* ---- Körper ---- */
  const O='#160f26';                                        // Kontur wie im Vorbild
  if(sitting){
    R(0,52,44,14,O);
    R(3,55,38,9,P.pants); R(5,58,34,5,'#2a2a3e');
    R(1,60,42,5,P.pants); R(1,63,42,2,'#252537');
    R(4,52,8,5,P.skin); R(32,52,8,5,P.skin);                // Hände auf Knien
    R(4,52,8,1,'#ffe3c4'); R(32,52,8,1,'#ffe3c4');
    R(6,55,1,2,P.skinDk); R(8,55,1,2,P.skinDk);
    R(34,55,1,2,P.skinDk); R(36,55,1,2,P.skinDk);
  }else{
    // Stand-/Spielbein: rechtes Bein leicht versetzt = Pose statt Symmetrie
    R(12,54,10,15,O); R(21,55,10,15,O);
    R(14,55,7,13,P.pants); R(23,56,7,12,P.pants);
    R(14,55,7,1,'#454560'); R(23,56,7,1,'#454560');
    R(13,66,9,2,'#191922'); R(22,67,9,2,'#191922');
  }
  // Torso — Schulter breit, Taille schmal, Hüfte mittel (DOTT-Silhouette)
  R(8-e,32+yb-e,28+e*2,25,O);
  R(9-e,33+yb-e,26+e*2,8,P.top);                             // Schultern
  R(12-e,41+yb-e,20+e*2,8,P.top);                            // Taille
  R(10-e,49+yb-e,24+e*2,7,P.top);                            // Hüfte
  R(9-e,33+yb-e,26+e*2,2,P.topHi);
  R(10-e,53,24+e*2,2,P.topDk);
  R(13,36+yb-e,3,14,P.topHi);                                // Faltenlicht
  R(28,38+yb-e,3,11,P.topDk);
  // Arme — dunkler als Torso + Konturspalte dazwischen
  R(4,35+yb-e,7,19,O); R(33,35+yb-e,7,19,O);
  R(5,36+yb-e,5,17,P.topDk); R(34,36+yb-e,5,17,P.topDk);
  R(5,36+yb-e,5,1,P.top); R(34,36+yb-e,5,1,P.top);
  R(10,35+yb-e,1,18,O); R(33,35+yb-e,1,18,O);
  if(!sitting){ R(4,52,7,6,P.skin); R(33,52,7,6,P.skin);     // große DOTT-Hände
    R(4,52,7,1,'#ffe3c4'); R(33,52,7,1,'#ffe3c4');
    R(6,55,1,3,P.skinDk); R(8,55,1,3,P.skinDk);
    R(35,55,1,3,P.skinDk); R(37,55,1,3,P.skinDk); }
  // Hals
  R(18,28+yb,8,6,P.skinSh); R(19,28+yb,6,5,P.skin); R(18,33+yb,8,1,P.skinDk);

  const yh=yb+hb;                                            // Kopfhöhe

  /* ---- Haar hinten ---- */
  R(9,2+yh,26,36,O);
  R(11,4+yh,22,32,P.hairDk);
  R(11,4+yh,22,2,P.hairMid);
  R(10,10+yh,3,24,P.hairDk); R(31,10+yh,3,24,P.hairDk);

  /* ---- Kopf ---- */
  R(14,6+yh,16,20,P.skin);
  R(15,4+yh,14,3,P.skin);
  R(15,26+yh,14,2,P.skin);                                   // Kiefer
  R(17,28+yh,10,2,P.skin);                                   // Kinn
  R(17,29+yh,10,1,P.skinSh);
  R(14,6+yh,16,2,'#ffe6cc');                                 // Stirnlicht
  R(28,8+yh,2,18,P.skinSh);                                  // Schattenseite
  R(14,8+yh,1,16,P.skinSh);
  // Ohren
  R(12,15+yh,2,6,P.skin); R(30,15+yh,2,6,P.skin);
  R(12,17+yh,1,3,P.skinDk); R(31,17+yh,1,3,P.skinDk);

  /* ---- Haar vorne ---- */
  R(13,3+yh,18,5,P.hair);
  R(15,3+yh,11,2,P.hairHi);
  R(13,7+yh,4,4,P.hair); R(27,7+yh,4,4,P.hair);
  R(12,5+yh,3,26,P.hair); R(29,5+yh,3,26,P.hair);
  R(12,5+yh,1,24,P.hairMid); R(31,5+yh,1,24,P.hairMid);
  R(17,4+yh,1,4,P.hairMid); R(23,3+yh,1,4,P.hairMid);        // Strähnen
  R(13,20+yh,2,10,P.hairMid); R(29,22+yh,2,8,P.hairMid);

  /* ---- Gesicht ---- */
  // Brauen
  let bl0=12,br0=12;
  if(laughing){bl0=10;br0=10;}
  else if(rolling||mo==='roll'){bl0=10;br0=10;}
  else if(scratching){bl0=10;br0=13;}                        // eine hoch, eine runter
  R(16,bl0+yh,5,1,P.hairDk); R(23,br0+yh,5,1,P.hairDk);
  R(16,bl0+yh,2,1,P.hairMid); R(26,br0+yh,2,1,P.hairMid);

  // Augen
  if(laughing){                                              // Lachfältchen, Augen zu
    R(16,15+yh,5,1,P.lash); R(23,15+yh,5,1,P.lash);
    R(16,14+yh,1,1,P.lash); R(20,14+yh,1,1,P.lash);
    R(23,14+yh,1,1,P.lash); R(27,14+yh,1,1,P.lash);
    R(15,17+yh,2,1,P.skinDk); R(28,17+yh,2,1,P.skinDk);
  }else if(blink){
    R(16,16+yh,5,1,P.lash); R(23,16+yh,5,1,P.lash);
  }else{
    // Blickrichtung: Augenrollen fährt einmal oben herum
    let ox=0,oy=0;
    if(rolling){
      const p=a/1.1;
      ox=p<0.33?-1:p<0.66?0:1; oy=-1;
    }else if(mo==='roll'){ oy=0; }
    else if(scratching){ ox=1; oy=0; }
    R(16,14+yh,5,4,P.white); R(23,14+yh,5,4,P.white);
    R(17,14+yh,3,4,P.iris);  R(24,14+yh,3,4,P.iris);
    R(18+ox,15+yh+oy,2,3+(oy?-1:0),P.pupil); R(25+ox,15+yh+oy,2,3+(oy?-1:0),P.pupil);
    if(!oy){R(17,15+yh,1,1,'#ffffff'); R(24,15+yh,1,1,'#ffffff');}
    R(16,13+yh,5,1,P.lash);  R(23,13+yh,5,1,P.lash);
    R(16,18+yh,5,1,P.skinSh); R(23,18+yh,5,1,P.skinSh);
  }
  // Nase
  R(21,17+yh,2,4,P.skinSh); R(21,21+yh,3,1,P.skinDk);
  R(20,21+yh,1,1,P.skinDk); R(23,21+yh,1,1,P.skinDk);
  // Mund
  if(laughing){                                              // offener Lachmund
    R(18,23+yh,8,5,'#5a2630');
    R(19,23+yh,6,1,'#f6f2ec');                               // Zähne
    R(20,26+yh,4,1,'#c4606a');                               // Zunge
    R(17,23+yh,1,1,P.lip); R(26,23+yh,1,1,P.lip);
  }else if(mo==='roll'){
    R(19,24+yh,7,1,P.lip); R(19,25+yh,1,1,P.lip);            // schmal, links runter
  }else if(mo==='scratch'){
    R(19,24+yh,6,1,P.lip); R(20,25+yh,4,1,P.lipHi); R(25,24+yh,1,1,P.skinDk);
  }else{
    R(18,24+yh,8,1,P.lip); R(19,25+yh,6,1,P.lipHi); R(20,23+yh,4,1,P.skinSh);
  }
  // Wangen
  R(15,20+yh,3,2,P.blush); R(26,20+yh,3,2,P.blush);
  if(laughing){ R(15,19+yh,4,3,P.blush); R(25,19+yh,4,3,P.blush); }
  // Bart (Jonas)
  if(P.beard){

}

/* ================= Figuren V2 — echte DOTT-Proportionen =================
   Riesenkopf (~1/3 Körper), dünner Hals, Wespentaille, Riesenhände/-füße,
   asymmetrische Pose (Hand in der Hüfte, Standbein/Spielbein).
   Überschreibt die alte figure()-Deklaration. Raster 48 x 92 (stehend) / 48 x 66 (sitzend). */
function figure(cx,top,s,P,t,breath,sitting,phase,blinkOff,mood,age,talking,walking){
  PS=1;
  const R=(x,y,w,h,c)=>px(cx+x*s,top+y*s,w*s,h*s,c);
  const O='#12091e';
  const e=breath>0.58?1:0;
  const sway=Math.sin(t/1600+phase)>0?0:1;
  const cyc=(t+phase*1000)%4200;
  const mo=mood||'neutral';
  const a=age||0;
  const laughing=(mo==='laugh'&&a<3.4);
  const rolling=(mo==='roll'&&a<1.1);
  const scratching=(mo==='scratch'&&a<3.4);
  const blink=laughing?true:(!blinkOff&&(cyc<130||(cyc>1700&&cyc<1810)));
  const yb=sway+(laughing?(Math.sin(t/95)>0?0:1):0);
  const yh=yb+(laughing?-2:0);
  const ty=sitting?30:33;                    // Torso-Oberkante

  if(sitting){
    /* Schneidersitz */
    R(2,54+yb,44,13,O);
    R(4,56+yb,40,7,P.pants); R(2,61+yb,44,4,P.pants); R(2,64+yb,44,2,'#20202f');
    R(4,50+yb,10,8,O); R(34,50+yb,10,8,O);                    // Riesenhände auf Knien
    R(5,51+yb,8,6,P.skin); R(35,51+yb,8,6,P.skin);
    R(5,51+yb,8,1,'#ffe3c4'); R(35,51+yb,8,1,'#ffe3c4');
    R(7,54+yb,1,3,P.skinDk); R(10,54+yb,1,3,P.skinDk);
    R(37,54+yb,1,3,P.skinDk); R(40,54+yb,1,3,P.skinDk);
    /* Torso mit Taille */
    R(13,29+yb-e,22,26+e,O);
    R(14,30+yb-e,20,9+e,P.top);
    R(17,38+yb,14,8,P.top);
    R(15,45+yb,18,9,P.top);
    R(14,30+yb-e,20,2,P.topHi);
    R(16,33+yb,3,16,P.topHi); R(29,34+yb,3,14,P.topDk);
    /* Arme zu den Knien */
    R(9,32+yb-e,6,19,O); R(10,33+yb-e,4,17,P.topDk);
    R(33,32+yb-e,6,19,O); R(34,33+yb-e,4,17,P.topDk);
  }else{
    /* Beine — lang, dünn; beim Gehen wechselnder Schritt */
    const wk=walking?(Math.sin(t/130)>0?2:0):0;
    const wk2=walking?(2-wk):0;
    R(16,58,9,28,O); R(25,59,9,28,O);
    R(17,59-wk,7,26,P.pants); R(26,60-wk2,7,26,P.pants);
    R(17,59-wk,2,26,'#4a4a68'); R(26,60-wk2,2,26,'#4a4a68');
    /* Riesenschuhe */
    R(10-wk,84-wk,15,7,O); R(25+wk2,86-wk2,15,7,O);
    R(11-wk,85-wk,13,5,'#1c1c28'); R(26+wk2,87-wk2,13,5,'#1c1c28');
    R(11-wk,85-wk,13,1,'#3c3c52'); R(26+wk2,87-wk2,13,1,'#3c3c52');
    if(P.stout){
      /* Jonas: Fass-Torso mit Bauch statt Taille */
      R(11,32-e+yb,26,29+e,O);
      R(12,33-e+yb,24,27+e,P.top);
      R(12,33-e+yb,24,2,P.topHi);
      R(10,44,28,13,O); R(11,45,26,11,P.top);
      R(11,53,26,2,P.topDk);
      R(14,36+yb,3,16,P.topHi); R(31,38+yb,3,14,P.topDk);
    }else{
      /* Hüfte + A-Linie */
      R(13,51,22,10,O);
      R(14,52,20,8,P.top);
      R(11,56,26,6,O); R(12,57,24,4,P.top); R(12,59,24,2,P.topDk);
      /* Wespentaille */
      R(15,43,18,10,O); R(16,44,16,8,P.top);
      R(17,44,3,8,P.topHi);
      /* Brustkorb/Schultern */
      R(12,32-e+yb,24,13+e,O);
      R(13,33-e+yb,22,11+e,P.top);
      R(13,33-e+yb,22,2,P.topHi);
      R(15,36+yb,3,8,P.topHi); R(30,37+yb,3,7,P.topDk);
    }
    /* Linker Arm — hängt mit leichtem Bogen, Riesenhand */
    R(8,34-e+yb,6,13,O); R(9,35-e+yb,4,11,P.topDk);
    R(6,45,6,12,O); R(7,46,4,10,P.topDk);
    R(3,55,10,9,O); R(4,56,8,7,P.skin); R(4,56,8,1,'#ffe3c4');
    R(6,60,1,3,P.skinDk); R(9,60,1,3,P.skinDk);
    /* Rechter Arm — Hand in der Hüfte (entfällt beim Kratzen) */
    if(!scratching){
      R(34,34-e+yb,6,11,O); R(35,35-e+yb,4,9,P.topDk);
      R(35,43,7,6,O); R(36,44,5,4,P.topDk);
      R(31,47,9,8,O); R(32,48,7,6,P.skin);
      R(32,48,7,1,'#ffe3c4');
    }
  }

  /* Hals — dünn */
  R(20,ty-5+yb,8,6,O); R(21,ty-5+yb,6,5,P.skinSh); R(22,ty-5+yb,4,4,P.skin);

  /* Haar hinten */
  if(P.bun){
    /* Jonas: kurzer Schopf + Dutt */
    R(8,0+yh,32,16,O);
    R(9,1+yh,30,14,P.hairDk);
    R(18,-6+yh,12,8,O); R(19,-5+yh,10,6,P.hair); R(20,-5+yh,4,2,P.hairHi);
  }else{
    /* Lauren: große Masse bis auf die Schultern */
    R(7,0+yh,34,ty+9,O);
    R(8,1+yh,32,ty+7,P.hairDk);
    R(8,1+yh,32,3,P.hairMid);
  }

  /* Kopf — riesig */
  R(10,2+yh,28,28,O);
  R(11,3+yh,26,26,P.skin);
  R(13,2+yh,22,2,P.skin);
  R(14,28+yh,20,3,P.skin); R(16,30+yh,16,2,P.skin);
  R(11,3+yh,26,2,'#ffe6cc');
  R(34,5+yh,3,22,P.skinSh); R(11,6+yh,2,20,P.skinSh);
  /* Ohren */
  R(8,14+yh,3,8,O); R(37,14+yh,3,8,O);
  R(9,15+yh,2,6,P.skin); R(37,15+yh,2,6,P.skin);

  /* Haar vorne */
  R(9,0+yh,30,7,P.hair);
  R(11,0+yh,22,2,P.hairHi);
  R(15,6+yh,3,2,P.hairMid); R(22,5+yh,3,3,P.hairMid); R(30,6+yh,3,2,P.hairMid); // Pony-Zacken
  if(P.bun){
    R(8,4+yh,4,10,P.hair); R(36,4+yh,4,10,P.hair);   // kurze Koteletten
  }else{
    /* Säulen enden auf Wangenhöhe, fallen dann HINTER die Schulter (kein "Bart") */
    R(4,16+yh,6,ty-8,O); R(38,16+yh,6,ty-8,O);
    R(8,4+yh,4,16,P.hair); R(36,4+yh,4,16,P.hair);
    R(8,4+yh,1,14,P.hairMid); R(39,4+yh,1,14,P.hairMid);
    R(6,18+yh,4,8,P.hair); R(38,18+yh,4,8,P.hair);
    R(5,24+yh,4,ty-16,P.hairDk); R(39,24+yh,4,ty-16,P.hairDk);
    R(9,15+yh,2,6,P.hairMid); R(37,16+yh,2,6,P.hairMid);
  }
  if(P.band){ R(9,7+yh,30,3,P.band); R(9,7+yh,30,1,'#e89a5c'); }   // Stirnband

  /* Gesicht — große Züge */
  const bl0=(laughing||rolling)?9:scratching?9:11;
  const br0=scratching?12:bl0;
  R(14,bl0+yh,7,2,O); R(27,br0+yh,7,2,O);
  if(laughing){
    R(14,15+yh,7,2,O); R(27,15+yh,7,2,O);
    R(13,13+yh,2,2,O); R(20,13+yh,2,2,O);
    R(26,13+yh,2,2,O); R(33,13+yh,2,2,O);
  }else if(blink){
    R(14,16+yh,7,2,O); R(27,16+yh,7,2,O);
  }else{
    let ox=0,oy=0;
    if(rolling){const p=a/1.1;ox=p<0.33?-1:p<0.66?0:1;oy=-1;}
    else if(scratching){ox=1;}
    R(13,12+yh,8,8,O); R(26,12+yh,8,8,O);
    R(14,13+yh,6,6,P.white); R(27,13+yh,6,6,P.white);
    R(15+ox,13+yh+oy,4,6,P.iris); R(28+ox,13+yh+oy,4,6,P.iris);
    R(16+ox,15+yh+oy,2,3,P.pupil); R(29+ox,15+yh+oy,2,3,P.pupil);
    R(15,14+yh,1,1,'#ffffff'); R(28,14+yh,1,1,'#ffffff');
  }
  /* Knollennase */
  R(22,18+yh,4,5,P.skinSh); R(21,22+yh,6,2,P.skinDk);
  /* Mund — breit */
  if(laughing){
    R(15,24+yh,18,6,O);
    R(16,25+yh,16,4,'#5a2630');
    R(17,25+yh,14,1,'#f6f2ec');
    R(20,28+yh,8,1,'#c4606a');
  }else if(mo==='roll'){
    R(17,26+yh,12,2,O); R(17,28+yh,2,1,O);
  }else if(mo==='scratch'){
    R(18,26+yh,10,2,P.lip); R(28,25+yh,2,2,P.skinDk);
  }else if(talking&&Math.sin(t/130)>0){
    R(16,24+yh,15,5,O);                          // Lip-Flap beim Sprechen
    R(17,25+yh,13,3,'#5a2630');
    R(18,25+yh,11,1,'#f6f2ec');
  }else{
    R(16,25+yh,15,2,P.lip); R(18,27+yh,11,1,P.lipHi);
  }
  R(11,20+yh,4,3,P.blush); R(33,20+yh,4,3,P.blush);
  if(laughing){R(10,19+yh,5,4,P.blush);R(33,19+yh,5,4,P.blush);}
  /* Bart (Jonas) */
  if(P.beard){
    R(12,24+yh,24,6,P.beard); R(14,29+yh,20,3,P.beard);
    R(16,25+yh,15,2,P.lip);
  }
  /* Rimlight — warmes Kantenlicht von oben rechts */
  R(35,5+yh,2,20,'rgba(255,224,170,0.28)');
  R(33,33-e+yb,2,10,'rgba(255,224,170,0.20)');
  if(!sitting)R(32,52,2,7,'rgba(255,224,170,0.16)');
  /* Am Kopf kratzen */
  if(scratching){
    const j=Math.sin(t/110)>0?0:1;
    const ab=sitting?32:34;
    R(ab,34-e+yb,6,10,O); R(ab+1,35-e+yb,4,8,P.topDk);
    R(37,18+yh-j,6,18,O); R(38,19+yh-j,4,16,P.topDk);
    R(33,11+yh-j,10,9,O); R(34,12+yh-j,8,7,P.skin);
    R(35,15+yh-j,1,3,P.skinDk); R(38,15+yh-j,1,3,P.skinDk);
  }
  PS=1;
}

/* ================= Figuren V3 — Kurven statt Klötze =================
   Vektor-Cartoon: runder Kopf mit Bob, Sanduhr-Torso, Stroke-Gliedmaßen
   mit runden Kappen, Riesenhände. Überschreibt figure() erneut.
   Einheitenraum 48 x ~92 (stehend) / 48 x ~70 (sitzend). */
function figure(cx,top,s,P,t,breath,sitting,phase,blinkOff,mood,age,talking,walking,prop,face,socks){
  const O='#12091e';
  const m=(face<0?-1:1), fx=(face||0)*3.2;      // Dreiviertel-Blick: Gesicht rückt zur Blickseite
  const mo=mood||'neutral', a=age||0;
  let chewing=false;
  const laughing=(mo==='laugh'&&a<3.4);
  const rolling=(mo==='roll'&&a<1.1);
  const scratching=(mo==='scratch'&&a<3.4);
  const medi=(mo==='medi');                       // meditiert: Augen zu, Atem sichtbar
  const cyc=(t+phase*1000)%4200;
  const blink=(laughing||medi)?true:(!blinkOff&&(cyc<130||(cyc>1700&&cyc<1810)));
  const sway=Math.sin(t/1500+phase)*0.6;
  const bounce=laughing?(Math.sin(t/95)>0?0:1.2):0;
  const c=ctx;
  c.save(); c.translate(cx,top); c.scale(s,s);
  c.lineJoin='round'; c.lineCap='round';

  const F=fill=>{c.fillStyle=fill;c.fill();c.strokeStyle=O;c.lineWidth=1.15;c.stroke();};
  const limb=(pts,w,col)=>{
    c.beginPath();c.moveTo(pts[0][0],pts[0][1]);
    for(let i=1;i<pts.length;i+=2)c.quadraticCurveTo(pts[i][0],pts[i][1],pts[i+1][0],pts[i+1][1]);
    c.strokeStyle=O;c.lineWidth=w+2;c.stroke();
    c.strokeStyle=col;c.lineWidth=w;c.stroke();
  };
  const hand=(x,y,r)=>{
    c.beginPath();c.ellipse(x,y,r,r*0.92,0,0,7);F(P.skin);
    c.strokeStyle=P.skinDk;c.lineWidth=0.6;
    c.beginPath();c.moveTo(x-r*0.35,y+r*0.35);c.lineTo(x-r*0.35,y+r*0.72);
    c.moveTo(x+r*0.15,y+r*0.4);c.lineTo(x+r*0.15,y+r*0.75);c.stroke();
  };

  const HX=24;
  const shY=(sitting?32:33)-(breath-0.5)*2.4+sway*0.3;   // Schulterlinie atmet

  /* ---------- Unterbau ---------- */
  if(sitting){
    c.beginPath();
    c.moveTo(2,66);c.quadraticCurveTo(4,52,16,52);
    c.lineTo(32,52);c.quadraticCurveTo(44,52,46,66);
    c.quadraticCurveTo(24,70,2,66);c.closePath();F(P.pants);
    // angedeutete überkreuzte Schienbeine — kein "Rock"-Kegel mehr
    limb([[11,60.5],[24,55.5],[37,61.5]],4.2,P.pants);
    limb([[37,60],[24,55],[11,61]],4.2,P.pants);
  }else{
    const swing=walking?Math.sin(t/130)*4:0;
    limb([[19,56],[18,70],[18+swing*0.4,84]],6.5,P.pants);
    limb([[29,56],[30,70],[30-swing*0.4,84]],6.5,P.pants);
    if(socks){                                     // Schuhe sind aus — Sockenfüße
      c.beginPath();c.ellipse(15+swing*0.4,87.5,6.8,3.1,0,0,7);F(P.sockCol||'#e8e4da');
      c.beginPath();c.ellipse(33-swing*0.4,88.5,6.8,3.1,0,0,7);F(P.sockCol||'#e8e4da');
      if(P.sneaker){                               // Kevins berühmtes Loch — "damit der Zeh was sieht"
        c.fillStyle=P.skin;c.beginPath();c.ellipse(18.5+swing*0.4,86.6,1.5,1.1,0,0,7);c.fill();
      }
      if(P.bun){                                   // Jonas' berühmte Zehensocken
        c.strokeStyle='#c8703c';c.lineWidth=1;
        c.beginPath();c.moveTo(10,86.4);c.lineTo(12,88.6);c.moveTo(13.4,86);c.lineTo(15.4,88.2);c.moveTo(16.8,86.2);c.lineTo(18.4,88);c.stroke();
        c.beginPath();c.moveTo(28,87.4);c.lineTo(30,89.6);c.moveTo(31.4,87);c.lineTo(33.4,89.2);c.moveTo(34.8,87.2);c.lineTo(36.4,89);c.stroke();
      }
    }else{
    c.beginPath();c.ellipse(15+swing*0.4,87.5,8.2,3.6,0,0,7);F(P.sneaker||'#1c1c28');
    c.beginPath();c.ellipse(33-swing*0.4,88.5,8.2,3.6,0,0,7);F(P.sneaker||'#1c1c28');
    if(P.sneaker&&!socks){                                 // weiße Sneaker: dunkle Streifen + Sohle
      c.strokeStyle='#3a3a44';c.lineWidth=0.8;
      c.beginPath();c.moveTo(11+swing*0.4,86.6);c.lineTo(14+swing*0.4,88.6);
      c.moveTo(14+swing*0.4,86.2);c.lineTo(17+swing*0.4,88.2);c.stroke();
      c.beginPath();c.moveTo(29-swing*0.4,87.6);c.lineTo(32-swing*0.4,89.6);
      c.moveTo(32-swing*0.4,87.2);c.lineTo(35-swing*0.4,89.2);c.stroke();
      c.fillStyle='#b8b8c0';
      c.fillRect(7.5+swing*0.4,89.6,15,1.2);c.fillRect(25.5-swing*0.4,90.6,15,1.2);
    }
    }
  }

  /* ---------- Torso ---------- */
  c.beginPath();
  if(P.stout){
    c.moveTo(HX-13,shY);
    c.quadraticCurveTo(HX-17,shY+12,HX-14,(sitting?52:56));
    c.quadraticCurveTo(HX,(sitting?58:62),HX+14,(sitting?52:56));
    c.quadraticCurveTo(HX+17,shY+12,HX+13,shY);
    c.quadraticCurveTo(HX,shY-3,HX-13,shY);
  }else if(P.straight){
    // Kevin: gerader Männer-Torso, Hemd fällt locker — keine Taille
    c.moveTo(HX-12,shY);
    c.quadraticCurveTo(HX-13.5,shY+14,HX-12.5,(sitting?53:60));
    c.lineTo(HX+12.5,(sitting?53:60));
    c.quadraticCurveTo(HX+13.5,shY+14,HX+12,shY);
    c.quadraticCurveTo(HX,shY-3,HX-12,shY);
  }else{
    c.moveTo(HX-12,shY);
    c.quadraticCurveTo(HX-13,shY+8,HX-7,shY+14);
    c.quadraticCurveTo(HX-15,(sitting?48:54),HX-13,(sitting?53:60));
    c.lineTo(HX+13,(sitting?53:60));
    c.quadraticCurveTo(HX+15,(sitting?48:54),HX+7,shY+14);
    c.quadraticCurveTo(HX+13,shY+8,HX+12,shY);
    c.quadraticCurveTo(HX,shY-3,HX-12,shY);
  }
  c.closePath();F(P.top);
  c.beginPath();c.moveTo(HX-8,shY+2);c.quadraticCurveTo(HX-10,shY+10,HX-6,shY+16);
  c.strokeStyle=P.topHi;c.lineWidth=2;c.stroke();
  if(P.jacket){
    // Offene Jacke über dem Top — zwei Seitenpaneele + Kragen
    const hem=sitting?52:58;
    c.beginPath();c.moveTo(HX-12.5,shY+0.5);
    c.quadraticCurveTo(HX-14.5,shY+12,HX-13,hem);
    c.lineTo(HX-7.5,hem);
    c.quadraticCurveTo(HX-9,shY+12,HX-8,shY+1.5);
    c.closePath();F(P.jacket);
    c.beginPath();c.moveTo(HX+12.5,shY+0.5);
    c.quadraticCurveTo(HX+14.5,shY+12,HX+13,hem);
    c.lineTo(HX+7.5,hem);
    c.quadraticCurveTo(HX+9,shY+12,HX+8,shY+1.5);
    c.closePath();F(P.jacket);
    c.beginPath();c.moveTo(HX-8,shY+0.5);c.lineTo(HX-3.5,shY+4.5);c.lineTo(HX-8.5,shY+6.5);c.closePath();F(P.jacketDk);
    c.beginPath();c.moveTo(HX+8,shY+0.5);c.lineTo(HX+3.5,shY+4.5);c.lineTo(HX+8.5,shY+6.5);c.closePath();F(P.jacketDk);
  }
  if(P.stout){

/* ================= Szenen (320x200-Koordinaten, PS=1.5) ================= */
/* DOTT-Optik: nichts steht gerade. Wände kippen, Böden fluchten, Licht fällt in Kegeln. */

function starsIn(t,x0,x1,y0,y1,mul){
  for(const s of stars){if(s.x<x0||s.x>x1||s.y<y0||s.y>y1)continue;
    const tw=.5+.5*Math.sin(t/420+s.b*9),v=((mul||170)*tw)|0;dot(s.x,s.y,`rgb(${v},${v},${v+30})`);}
}
/* Dielenfugen, die auf einen Fluchtpunkt zulaufen */
function floorSeams(vpx,yTop,col){
  for(let x=-40;x<=360;x+=36){
    const tx=vpx+(x-vpx)*0.22;
    poly([[x,200],[x+3,200],[tx+1,yTop],[tx,yTop]],col);
  }
}
/* Rot gestreifter Teppich in Perspektive — wie im Vorbild */
function rug(cx,yTop,wTop,yBot,wBot){
  poly([[cx-wTop/2,yTop],[cx+wTop/2,yTop],[cx+wBot/2,yBot],[cx-wBot/2,yBot]],'#8c2320');
  for(let i=0;i<6;i++){
    const a=i/6,b=(i+0.55)/6;
    const y1=yTop+(yBot-yTop)*a,y2=yTop+(yBot-yTop)*b;
    const w1=wTop+(wBot-wTop)*a,w2=wTop+(wBot-wTop)*b;

function wrapT(s,max){const o=[];let l='';for(const w of s.split(' ')){if((l+w).length>max){o.push(l.trim());l='';}l+=w+' ';}if(l.trim())o.push(l.trim());return o;}
function drawSay(txt,col,yTop,ax){
  if(!txt)return;
  PS=1;
  ctx.font='bold 13px ui-monospace,"Courier New",monospace';ctx.textBaseline='top';
  const cx0=(ax===undefined)?W/2:ax;
  let y=yTop;
  for(const ln of wrapT(txt,42)){
    const w=ctx.measureText(ln).width;
    const x=Math.round(Math.max(6,Math.min(W-6-w,cx0-w/2)));   // über dem Sprecher, im Bild gehalten
    ctx.fillStyle='#000';
    for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++)if(a||b)ctx.fillText(ln,x+a,y+b);
    ctx.fillStyle=col;ctx.fillText(ln,x,y);
    y+=15;
  }
}

         run:null,fails:0,waves:0,pending:null,pendingHint:'',
         mood:'neutral',moodStart:0,moodT:0,tram:null,gone:false,
         who:'n',autoNext:null,autoT:0,_lx:0,_kx:0};

/* Reaktion = Körpersprache. Keine Anzeige, keine Zahlen. */
const MOOD_OF={good:'laugh',ok:'neutral',meh:'scratch',bad:'roll'};
function react(kind){
  S.mood=MOOD_OF[kind]||'neutral';
  S.moodStart=performance.now();
  S.moodT=S.moodStart+1e9;                     // bleibt bis zum nächsten Beat sichtbar
}

/* Bewusst keine Anzeige: was sie denkt, steht in ihrem Gesicht. */
function stats(){ $sline.innerHTML=''; }
function flushOpts(){
  $hint.textContent=S.pendingHint||'Wähle';
  $ch.innerHTML='';
  (S.pending||[]).forEach((o,i)=>{
    const li=document.createElement('li');
    li.textContent=(S.pending.length>1?(i+1)+'. ':'')+o.t;
    li.onclick=()=>{
      audioInit();
      // Monkey-Island-Echo: gesprochene Antworten sagt Kevin erst selbst (blau, über ihm)
      if(S.mode==='talk'&&/^[»"]/.test(o.t)){
        line('k',o.t.replace(/^[»"\s]+|["«\s]+$/g,''));
        opts([],'…');
        S.autoNext=o.go;
        return;
      }
      o.go();
    };
    $ch.appendChild(li);
  });
  stats();
}
function opts(list,hint){
  S.pending=list;S.pendingHint=hint;
  if(S.typing){$ch.innerHTML='';$hint.textContent='…';stats();}
  else flushOpts();
}
function line(who,txt){
  S.who=who;
  S.full=(who==='l'?'Lauren: ':who==='j'?'Jonas: ':who==='k'?'Kevin: ':'')+txt;
  S.col=who==='l'?'#f0b8c8':who==='j'?'#e0c27a':who==='k'?'#9ac0f0':'#b8b8cc';
  S.shown=0;S.typing=true;S.pause=0;
}
function beat(who,txt,list,hint){S.mood='neutral';S.moodT=0;line(who,txt);opts(list,hint);}
function reply(who,txt,next){line(who,txt);opts([{t:'…',go:next}],'Weiter');}
function skipTyping(){
  if(S.typing){S.shown=S.full.length;S.typing=false;flushOpts();
    if(S.autoNext)S.autoT=performance.now()+260;
    return true;}
  return false;
}

function rk(kind){SFX[kind]();react(kind);}
function feedback(sym,cringe){
  const kind = cringe>=2?'bad' : cringe===1?'meh' : sym>=2?'good' : 'ok';
  SFX[kind]();react(kind);
  return kind;
}

let ti=0;
function talkBeat(){
  if(ti>=RAW.length)return preGauntlet();
  const b=RAW[ti];
  S.scene=b.sc;S.pose='stand';S.jonas=(b.who==='j'||!!b.jon);
  S.riegel=(b.sc==='front'&&ti>=1);            // ab dem Riegel-Beat isst sie sichtbar
  beat(b.who,b.txt,b.o.map(o=>({t:o[0],go:()=>{
    S.sym+=o[1];S.cringe+=o[2];
    feedback(o[1],o[2]);
    line(o[3],o[4]);
    opts([{t:'…',go:()=>{ti++;SFX.page();talkBeat();}}],'Weiter');
  }})),b.hint);
}

function preGauntlet(){
  S.jonas=true;S.scene='studio';S.pose='sit';   // Text sagt sitzen → Bild zeigt sitzen
  if(S.cringe>=7&&!S.cringeWarned){             // kein Game Over mehr — nur ein Dämpfer
    S.cringeWarned=true;SFX.bad();react('roll');
    return beat('l','Sie legt ihre Matte demonstrativ einen halben Meter weiter weg. "Isch brauche Raum. Du bist anstrengend. Interessant-anstrengend. Aber anstrengend."',[
      {t:'…',go:preGauntlet}
    ],'Gerade nochmal gutgegangen — das Date läuft weiter');
  }
  beat('l','"Setz disch." Sie klopft auf die Matte neben ihrer. "Und wenn du gleisch ohnmächtig wirst — isch fang disch nisch auf. Isch bin dann selber weg."',[
    {t:'"Abgemacht. Ich falle nach rechts."',go:()=>{S.sym++;rk('good');introGauntlet();}},
    {t:'"Wenn ich falle, dann mit Stil."',go:()=>{S.sym++;rk('good');introGauntlet();}},
    {t:'"Ist das hier auch Energiearbeit?"',go:()=>{S.sym++;rk('ok');reply('l','"Alles ist Energiearbeit. Auch die Tram. Die Tram besonders."',introGauntlet);}},
    {t:'Du sagst nichts und schließt die Augen.',go:introGauntlet}
  ],'Gleich geht es los');
}


/* ================= AKT 2 — Atem-Gauntlet ================= */
const WAVES=[
  {name:'Welle 1 — Ankommen',  band:42,speed:0.00050,need:140,drain:0.24,rise:0.85,fall:0.70},
  {name:'Welle 2 — Feueratem', band:22,speed:0.00105,need:185,drain:0.55,rise:1.05,fall:0.95},
  {name:'Welle 3 — Loslassen', band:19,speed:0.00150,need:210,drain:0.62,rise:1.30,fall:1.20}
];
const NW=WAVES.length;
const CHATTER=[
  'Jonas: "Nicht kontrollieren. Nur beobachten." Lauren atmet dir gegenüber. Sie ist erschreckend gut darin.',
  'Deine Hände kribbeln. Lauren flüstert: "Das sind die Ahnen." Du hoffst, es ist nur Kohlendioxid.'
];

function introGauntlet(){
  S.pose='sit';
  line('j','"Wir atmen in drei Wellen. Haltet den Atem im Fenster. Das Fenster wandert."');
  opts([
    {t:'Anfangen.',go:()=>startWave(0)},
    {t:'Atmen überspringen.',go:skipGauntlet}
  ],BREATH_HINT);
}
function skipGauntlet(){
  S.mode='talk';S.run=null;S.pose='sit';breathStop();SFX.meh();
  S.breathRe='skip';
  line('n','Du atmest irgendwie mit und denkst dabei an deine Mails. Es ist okay. Es ist nur nicht das, wofür der Kurs gedacht war.');
  opts([{t:'Danach rausgehen.',go:leaveStudio}],'Übersprungen  ·  keine Wellen');
}
/* Übergang: Studio → Straße, damit Jonas nicht einfach aus dem Spiel fällt */
function leaveStudio(){
  S.mode='talk';
  line('n','Schuhe wieder an, ein Nicken zu Jonas — "Bis nächste Woche. Oder bis gleich, das entscheidet euer Nervensystem." Draußen ist die Nacht kühl geworden.');
  opts([{t:'Raus in die Nacht.',go:walkScene}],'Ihr verlasst das Studio');
}
function startWave(i){
  const w=WAVES[i];S.mode='play';S.pose='sit';
  S.run={wave:i,v:50,center:50,focus:w.need*0.55,hold:false,t0:performance.now(),
         band:w.band,speed:w.speed,need:w.need,drain:w.drain,rise:w.rise,fall:w.fall,inband:false};
  line('n',w.name);S.col='#ffe066';
  breathStart();SFX.start();
  opts([{t:'Atmen überspringen.',go:skipGauntlet}],BREATH_HINT);
}
function waveWon(){
  const i=S.run.wave;S.mode='talk';S.waves=Math.max(S.waves,i+1);
  breathStop();SFX.win();
  if(i+1<NW){
    line('n',CHATTER[i]);
    opts([{t:'Weiteratmen.',go:()=>startWave(i+1)}],`Welle ${i+1} von ${NW} geschafft`);
  }else{
    S.sym+=4;
    S.breathRe=S.fails?'fought':'pure';
    line('n','Es wird still. Irgendwann sagt Jonas: "Kommt langsam zurück." Deine Hände sind warm. Lauren sitzt neben dir und grinst Löcher in die Decke.');
    S.col='#ffe066';
    opts([{t:'Zurückkommen.',go:leaveStudio}],'Alle drei Wellen geschafft');
  }
}
function waveLost(){
  S.mode='talk';S.fails++;breathStop();SFX.lose();
  const i=S.run.wave;
  const jokes=[
    'Du hyperventilierst wie ein defekter Kühlschrank. Jonas schaut kurz besorgt.',
    'Du atmest jetzt einfach nur noch. Ohne Konzept.',
    'Irgendwo im Raum sagt jemand "schhhh". Es könntest du gewesen sein.',
    'Lauren, ohne die Augen zu öffnen: "Atme, nicht arbeite."'
  ];
  line('n',jokes[Math.min(jokes.length-1,S.fails-1)]+' Jonas: "Kein Problem. Nochmal."');
  S.col='#ff9a7a';
  opts([
    {t:`Nochmal bei ${WAVES[i].name}.`,go:()=>startWave(i)},
    {t:'Atmen überspringen.',go:skipGauntlet}
  ],`Verloren bei ${WAVES[i].name}  ·  Versuch ${S.fails+1}`);
}

/* Eingabe */
const down=e=>{
  audioInit();
  if(S.mode==='title'){S.mode='talk';SFX.page();talkBeat();if(e&&e.cancelable)e.preventDefault();return;}
  if(S.mode==='tram'&&S.tram&&!S.tram.done){
    // Skip springt zur ABFAHRT, nicht ans Ende — Einfahren + Einsteigen bleiben immer sichtbar
    if(performance.now()-S.tram.t0>1200)S.tram.t0=Math.min(S.tram.t0,performance.now()-6600);
    if(e&&e.cancelable)e.preventDefault();return;}
  if(S.mode==='play'&&S.run){S.run.hold=true;skipTyping();if(e&&e.cancelable)e.preventDefault();return;}
  if(skipTyping()){if(e&&e.cancelable)e.preventDefault();return;}
  if(e&&e.cancelable)e.preventDefault();
};
const up=()=>{if(S.run)S.run.hold=false;};
cv.addEventListener('pointerdown',down);
addEventListener('pointerup',up);
addEventListener('pointercancel',up);
addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();if(!e.repeat)down(e);return;}
  const n=parseInt(e.key,10);
  if(n>=1&&n<=9){const li=$ch.children[n-1];if(li)li.click();}
});
addEventListener('keyup',e=>{if(e.code==='Space')up();});

/* ================= AKT 3 — Spezi ================= */
function walkScene(){
  S.scene='street';S.pose='stand';S.jonas=false;S.mode='talk';S.teary=true;
  const br=S.breathRe;
  if(br==='pure'){
    return beat('l','"Du warst ganz weg da drin, non? Isch hab kurz rübergeguckt. Du hast geleuchtet wie ein Toaster."',[
      {t:'"Du solltest bei deiner eigenen Atmung bleiben."',go:()=>{S.sym+=2;rk('good');reply('l','"Isch war bei meiner. Deine war nur lauter. Auf die gute Art."',walkSpaeti);}},
      {t:'"Ich hab nichts mitbekommen. Nicht mal dich."',go:()=>{S.sym+=2;rk('good');walkSpaeti();}},
      {t:'"Toaster leuchten nicht."',go:()=>{S.sym+=1;rk('ok');reply('l','"Meiner schon. Isch hab ihn kaputt gemacht. Langes Gedicht."',walkSpaeti);}}
    ],'Sie hat dich beobachtet');
  }
  if(br==='fought'){
    return beat('l','"Du hast da drin gekämpft. Mit dir selber. Isch mag Leute, die nochmal von vorn anfangen."',[
      {t:'"Ich hab mehrmals verloren."',go:()=>{S.sym+=2;rk('good');reply('l','"Isch weiß. Isch hab mitgezählt. Es war das Beste am ganzen Kurs."',walkSpaeti);}},
      {t:'"Der Atem hat angefangen."',go:()=>{S.sym+=1;rk('ok');walkSpaeti();}}
    ],'Sie hat mitgezählt');
  }
  if(br==='skip'){
    return beat('l','"Du hast an deine Mails gedacht." Pause. "Isch hab es gespürt. Dein Feld war im Büro."',[
      {t:'"Nur an eine. Eine sehr laute Mail."',go:()=>{S.cringe++;rk('meh');walkSpaeti();}},
      {t:'"Stimmt. Tut mir leid."',go:()=>{S.sym+=1;rk('ok');reply('l','"Beim nächsten Mal bleibst du. Falls es ein nächstes Mal gibt." Sie lässt den Satz absichtlich offen.',walkSpaeti);}}
    ],'Sie hat es gemerkt');
  }
  walkSpaeti();
}
function walkSpaeti(){
  S.scene='street';S.pose='stand';S.jonas=false;S.mode='talk';S.teary=true;
  beat('l','Sie nickt Richtung Kiosk-Licht. "Isch brauche jetzt Zucker. Der Riegel war Pappe. Spezi?"',[
    {t:'"Spezi. Aber die richtige, nicht die mit Kirschgeschmack."',go:()=>{S.sym+=2;rk('good');S.bottle=true;walk2();}},
    {t:'"Zwei. Ich zahl."',go:()=>{S.sym+=1;rk('ok');S.bottle=true;reply('l','"Oh. Ein Mann, der am Kiosk groß aufspielt." Sie meint es zur Hälfte spöttisch. Die andere Hälfte nimmt die Spezi.',walk2);}},
    {t:'"Du hattest doch gerade erst einen Riegel."',go:()=>{S.sym+=2;rk('good');S.bottle=true;reply('l','"Das war vor dem Atmen. Isch bin jetzt ein anderer Mensch. Der Mensch will Spezi."',walk2);}},
    {t:'"Ich trinke eigentlich keinen Zucker mehr." (Du trinkst Zucker.)',go:()=>{S.cringe++;rk('meh');S.bottle=true;reply('l','"Ehm. Du hältst gerade eine Spezi." — "Die ist für dich." — "Isch habe schon eine." Es entsteht eine Stille mit zwei Flaschen.',walk2);}}
  ],'Nach dem Kurs, am Kiosk');
}

  const played=S.waves>0;                      // SIE weint immer — sie war wirklich drin; nur DEINE Bezüge hängen am Skip
  S.teary=true;
  const txt=played
    ?'Ihr kommt aus dem Kiosk, jeder mit einer Flasche. Sie ist immer noch etwas verheult — beim Atmen hat es sie erwischt, irgendwo zwischen Welle zwei und drei. Sie tut nicht so, als wäre nichts.'
    :'Ihr kommt aus dem Kiosk, jeder mit einer Flasche. Sie ist etwas verheult — sie war wirklich da drin. Du warst die meiste Zeit im Büro, in deinem Kopf.';
  const os=[
    played?{t:'"Ich hab da drin an meinen Vater gedacht."',go:()=>{S.sym+=3;rk('good');reply('l','Sie bleibt kurz stehen und schaut auf ihre Flasche. "Isch auch. Nisch an deinen. An meinen." Pause. "Deshalb geh isch da hin. Man weint da für zwölf Euro fuffzig, das ist billiger als alles andere in dieser Stadt."',walk3);}}
          :{t:'"Du hast da drin geweint. Ich hab nur zugeschaut."',go:()=>{S.sym+=2;rk('ok');reply('l','"Du hast nisch zugeschaut. Du warst im Büro, in deinem Kopf. Aber du bist geblieben. Das zählt halb."',walk3);}},
    {t:'"Sag mir ein Gedicht. Irgendeins. Deins."',go:()=>{S.sym+=3;rk('good');reply('l','Sie sagt vier Zeilen auf Französisch. Du verstehst zwei Wörter. Eins davon ist Spezi. Sie hat es reingeschmuggelt.',walk3);}}
  ];
  if(S.breathRe!=='skip')os.push({t:'"Ich glaub, ich hab beim Atmen kurz geschlafen."',go:()=>{S.sym+=2;rk('good');reply('l','"Das war kein Schlaf. Das war Trance." — "Ich hab geschnarcht." — "Trance mit Ton."',walk3);}});
  os.push({t:'"War das jetzt eigentlich ein gutes Date?"',go:()=>{S.sym+=1;rk('ok');reply('l','"Frag misch das nisch mittendrin. Das ist wie den Kuchen aufmachen, während er backt."',walk3);}});

function walk3(){
  beat('n','An der Kreuzung bleibt sie stehen. Ihre Tram kommt in zwei Minuten. Sie schaut dich an und sagt nichts.',[
    {t:'Du entscheidest dich.',go:decision}
  ],'Der Moment');

/* ================= Ende ================= */
function decision(){
  beat('n','Zwei Minuten. Die Anzeige zählt runter. Irgendwas musst du jetzt wollen.',[
    {t:'» Ich will sie wiedersehen. «',go:()=>revealStep(1)},
    {t:'Ich lass es. War ein netter Abend.',go:noThanks}
  ],'Deine Entscheidung');
}
function noThanks(){
  SFX.endBad();react('scratch');
  line('l','"Okay." Pause. "Isch hätte jetzt was anderes gesagt. Aber okay."');
  S.col='#f0b8c8';
  opts([{t:'…',go:()=>{
    line('n','Du sagst nichts mehr. Sie auch nicht. Ihr wartet zusammen auf ihre Tram, und das ist plötzlich sehr lang.');
    opts([{t:'Warten.',go:()=>startTram({yes:false,after:
      '"Mach\'s gut, Kevin." Sie steigt ein, ohne sich nochmal umzudrehen. Du hast es gewusst, in der Sekunde, in der du es nicht gesagt hast.'})}],'Weiter');
  }}],'Weiter');
}

/* Beide sagen es laut — kein Overlay, keine Punkte. */
function revealStep(n){
  if(n===1){
    tone(523.25,0.9,'sine',0.06);
    line('n','Du sagst es. Es kommt schneller raus als geplant und ungefähr halb so elegant.');
    S.col='#ffe066';
    return opts([{t:'…',go:()=>revealStep(2)}],'Gesagt ist gesagt');
  }
  const score=S.sym-S.cringe*1.6+S.waves*1.4;
  if(score>=14){
    SFX.end();react('laugh');S.phoneHand=true;
    line('l','"Warte." Sie dreht dir ihr Handy hin. Da steht schon eine getippte, noch nicht abgeschickte Nachricht: "Samstag?" — "Isch wollte nur nisch die Erste sein."');
    opts([{t:'"Samstag."',go:()=>{rk('good');line('l','"Samstag. Isch bring die Riegel, du bringst die Spezi. Und den Helm."');
      opts([{t:'…',go:()=>startTram({yes:true,msg:'Samstag? — habe es endlisch abgeschickt. Riegel: isch. Spezi und Helm: du. ✦',after:'Sie winkt durch die Scheibe, mit beiden Händen, wie ein Kind. Lesen wirst du ihre Nachricht erst am Morgen.'})}],'Ihre Tram kommt');}}],'Sie hatte es schon getippt');
  }else if(score>=8){
    SFX.end();react('laugh');
    line('l','"Ja." Sie sagt es sofort, ohne die Pause, die du erwartet hast. "Aber diesmal ohne Jonas."');
    opts([{t:'"Ohne Jonas."',go:()=>{rk('good');line('l','"Bien. Isch schreib dir morgen. Wirklisch morgen, nicht Sonntag."');
      opts([{t:'…',go:()=>startTram({yes:true,msg:'Guten Morgen. Ja, isch meinte es ernst. Ohne Jonas.',after:'Sie schreibt tatsächlich am nächsten Morgen. Um sieben. Du schläfst noch.'})}],'Ihre Tram kommt');}}],'Sie sagt ja');
  }else if(score>=4){
    SFX.ok();react('scratch');
    line('l','"Ehm." Sie überlegt wirklich, das sieht man. "Isch weiß es noch nisch. Aber isch weiß auch nisch Nein. Das ist besser als es klingt, glaub mir."');
    opts([{t:'"Das nehm ich."',go:()=>{rk('ok');line('l','"Gut. Dann lass isch disch das nehmen." Sie kramt in der Jacke und drückt dir einen halben Proteinriegel in die Hand. "Anzahlung."');
      opts([{t:'…',go:()=>startTram({yes:true,msg:'Okay: Ja. Frag misch nisch, warum isch grinse.',card:'ZWEI MORGEN SPÄTER',after:'Zwei Tage lang nichts. Dann, am dritten Morgen, ohne Anlass: Sie kommt.'})}],'Ihre Tram kommt');}}],'Sie zögert ehrlich');
  }else{
    SFX.endBad();react('roll');
    line('l','"Kevin." Sie sagt deinen Namen so, wie man einen Satz beendet. "Du bist lieb. Aber isch will das nisch nochmal, glaub isch."');
    opts([{t:'"Okay."',go:()=>{line('l','"Okay." Sie nickt einmal. Dann, fast versöhnlich: "Den Vers mit dem Zeh und dem Fenster behalte isch trotzdem. Der kommt in ein Gedicht. Du wirst nisch erwähnt."');
      opts([{t:'…',go:()=>startTram({yes:false,after:'Sie steigt ein. Durch die Scheibe schaut sie noch kurz auf ihr Handy, nicht zu dir. Es ist nicht böse gemeint. Es ist nur zu Ende.'})}],'Ihre Tram kommt');}}],'Sie sagt es klar');
  }
}

/* ---- Die Tram fährt ein, sie steigt ein, die Tram fährt weg ---- */
function startTram(cfg){
  S.mode='tram';S.tram={t0:performance.now(),cfg,done:false};S.phoneHand=false;
  line('n','Die Tram kommt um die Kurve.');
  S.col='#dcdce8';
  opts([],'…  ('+(TOUCH?'Tipp':'Klick')+' ins Bild überspringt)');
  tone(220,1.4,'sawtooth',0.035,0,180);
}
function tramDone(){
  const cfg=S.tram.cfg;
  S.mode='end';
  cfg.yes?SFX.end():SFX.endBad();
  if(cfg.msg){
    S.phone={t0:performance.now(),msg:cfg.msg,card:cfg.card||'AM NÄCHSTEN MORGEN'};
    tone(1568,0.12,'sine',0.055,1.1);tone(2093,0.35,'sine',0.05,1.22);   // Nachrichten-Ding
  }
  line('n',cfg.after);
  S.col=cfg.yes?'#ffe066':'#ff9a7a';
  opts([{t:'Nochmal. Anderer Abend.',go:reset}],cfg.yes?'Ihr seht euch wieder':'Ihr seht euch nicht wieder');
}

/* Tram in 320er-Koordinaten */
function drawTram(x,doorOpen,t){
  PS=1.5;
  px(x,88,150,10,'#1a2030');                       // Dach
  px(x,96,150,46,'#dfe3ea');                       // Wagenkasten
  px(x,96,150,3,'#ffffff');
  px(x,120,150,4,'#1f5fbf');                       // blaues Band
  px(x,136,150,6,'#9aa2b0');
  px(x+2,102,32,16,'#0d1420');                     // Fenster
  px(x+38,102,30,16,'#0d1420');
  px(x+96,102,30,16,'#0d1420');
  px(x+130,102,18,16,'#0d1420');
  px(x+2,102,32,2,'rgba(255,255,255,0.16)');
  px(x+38,102,30,2,'rgba(255,255,255,0.16)');
  // warmes Innenlicht
  px(x+2,104,32,12,'rgba(255,220,150,0.20)');
  px(x+38,104,30,12,'rgba(255,220,150,0.20)');
  px(x+96,104,30,12,'rgba(255,220,150,0.20)');
  // Tür
  px(x+70,98,26,42,doorOpen?'#101624':'#c2c8d2');
  if(!doorOpen){px(x+82,98,2,42,'#8f97a4');px(x+72,102,20,14,'#0d1420');}
  // Front
  px(x+144,96,6,46,'#c8ccd4');
  px(x+146,132,4,4,'#ffe9a8');                     // Scheinwerfer
  px(x-2,132,4,4,'#c8462e');                       // Rücklicht
  px(x+140,88,10,4,'#1a2030');
  // Räder
  px(x+18,140,14,5,'#141822');px(x+112,140,14,5,'#141822');
  // Licht auf der Straße
  px(x,144,150,10,'rgba(255,230,180,0.05)');
  PS=1;
}

function reset(){
  S.scene='front';S.cringe=0;S.sym=0;S.fails=0;S.waves=0;S.jonas=false;
  S.pose='stand';S.mode='talk';S.run=null;ti=0;breathStop();
  S.tram=null;S.gone=false;S.mood='neutral';S.moodT=0;S.moodStart=0;
  S.breathRe=null;S.riegel=false;S.bottle=false;S.teary=false;
  S.cringeWarned=false;S.phone=null;S.autoNext=null;S.autoT=0;S.who='n';S.phoneHand=false;
  S.mode='title';S.full='';S.typing=false;
  opts([],'Ein Abend in München — '+(TOUCH?'tipp':'klick')+' ins Bild');
}

/* ================= Render ================= */
let last=0,blipCount=0;
function frame(t){
  const dt=Math.min(60,t-last)/1000;last=t;

  // Schreibmaschine
  if(S.typing){
    if(S.pause>0)S.pause-=dt;
    else{
      const before=Math.floor(S.shown);
      S.shown+=dt*52;
      const now=Math.min(S.full.length,Math.floor(S.shown));
      for(let i=before;i<now;i++){
        const chr=S.full[i];
        if(chr==='.'||chr==='?'||chr==='!')S.pause=0.20;
        else if(chr===','||chr===';'||chr==='—')S.pause=0.09;
        if(/[a-zA-ZäöüÄÖÜ]/.test(chr)&&(++blipCount%3===0))SFX.blip();
      }
      if(S.shown>=S.full.length){S.shown=S.full.length;S.typing=false;flushOpts();
        if(S.autoNext)S.autoT=t+620;}
    }
  }
  // Auto-Weiter nach Kevins Echo — Lauren antwortet ohne Extra-Klick
  if(S.autoT&&t>S.autoT){const f=S.autoNext;S.autoNext=null;S.autoT=0;if(f)f();}

  // Zeitsprung: mit ihrer Nachricht schneiden wir in Kevins Schlafzimmer, 07:02
  (S.phone?sceneBed:SCENE[S.scene])(t);

  // Atem-Physik
  if(S.mode==='play'&&S.run){
    const r=S.run,k=dt*60;                       // framerate-unabhängig (60-fps-Kalibrierung)
    r.v+=(r.hold?r.rise:-r.fall)*k;
    r.v=Math.max(0,Math.min(100,r.v));
    r.center=50+34*Math.sin((t-r.t0)*r.speed*2)+8*Math.sin((t-r.t0)*r.speed*5.3);
    r.center=Math.max(18,Math.min(82,r.center));
    r.inband=r.v>=r.center-r.band/2&&r.v<=r.center+r.band/2;
    r.focus+=(r.inband?1:-r.drain)*k;
    S.breath=r.v/100;
    breathUpdate(S.breath,r.hold,r.inband);
    if(r.focus>=r.need)waveWon(); else if(r.focus<=0)waveLost();
  }else{
    S.breath=0.5+0.5*Math.sin(t/900);
  }

  // Jonas hinten links (mit Kontaktschatten)
  if(S.jonas&&S.scene==='studio'){
    const jSit=(S.pose==='sit');                 // Jonas setzt sich mit, wenn alle sitzen
    PS=1;px(52,208,52,5,'rgba(10,6,20,0.30)');
    figure(jSit?208:182,jSit?112:84,1.4,JONAS,t,0.5,jSit,2.2,true,(S.mode==='play')?'medi':'neutral',0,S.typing&&S.who==='j',false,null,0,true);
  }

  // Lauren
  const lb=(S.mode==='play')?0.5+0.5*Math.sin(t/1300):0.5+0.5*Math.sin(t/1050);
  const mood=(S.mode==='play')?'medi':((t<S.moodT)?S.mood:'neutral');
  const mage=(performance.now()-S.moodStart)/1000;
  let lx,ly,showL=!S.gone;
  if(S.scene==='studio'){ lx=S.pose==='sit'?300:278; ly=S.pose==='sit'?114:56; }
  else if(S.scene==='front'){ lx=296; ly=84; }
  else { lx=298; ly=82; }

  // Kevin — du selbst, links im Bild, ihr zugewandt
  if(S.mode!=='end'||!S.phone){
    const kSit=(S.scene==='studio'&&S.pose==='sit');
    let kx,ky;
    if(S.scene==='studio'){kx=kSit?148:104;ky=kSit?116:56;}   // sitzend: auf SEINER Matte
    else if(S.scene==='front'){kx=112;ky=84;}
    else if(S.mode==='tram'){kx=20;ky=98;}                    // tritt zurück — Tram fährt nicht durch ihn durch
    else {kx=104;ky=82;}
    const ksc=(S.scene==='street')?1.8:2;
    const kfeet=kSit?ky+134:Math.round(ky+89*ksc);
    PS=1;px(kx+10,kfeet,Math.round(38*ksc),7,'rgba(10,6,20,0.32)');
    const kProp=(S.scene==='street'&&S.bottle)?'bottle':null;
    const kBreath=(S.mode==='play')?S.breath:0.5+0.5*Math.sin(t/1000+2);
    S._kx=kx;
    figure(kx,ky,ksc,KEVFIG,t,kBreath,kSit,0.6,false,(S.mode==='play')?'medi':'neutral',0,S.typing&&S.who==='k',false,kProp,1,S.scene==='studio');
  }

  /* Tram-Sequenz */
  if(S.mode==='tram'&&S.tram){
    const el=(t-S.tram.t0)/1000;
    let tx;                                              // Tram-Position (320er-Raum)
    if(el<2.0){ tx=340-(340-88)*Math.min(1,el/2.0); }    // einfahren
    else if(el<6.4){ tx=88; }                            // stehen
    else { tx=88-(el-6.4)*130; }                         // abfahren
    const doorOpen=(el>2.2&&el<5.4);
    if(el>=2.0&&el<2.25) { if(!S.tram.dingDone){S.tram.dingDone=true;tone(1046.5,0.16,'square',0.05);tone(784,0.2,'square',0.04,0.16);} }
    if(el>=5.4&&!S.tram.closeDone){S.tram.closeDone=true;tone(196,0.35,'triangle',0.06,0,140);}
    if(el>=6.4&&!S.tram.goDone){S.tram.goDone=true;tone(140,2.2,'sawtooth',0.045,0,300);}

    // sie geht die letzten Schritte ZUR TÜR und steigt ein
    if(el<2.4){ /* steht noch */ }
    else if(el<3.9){ const p=(el-2.4)/1.5; lx=298-p*52; ly=82+p*3; }
    else { showL=false; S.gone=true; }

    drawTram(tx,doorOpen,t);
    // sie winkt im Fenster, während die Tram wegfährt
    if(el>5.6){
      // Lauren im Tram-Fenster — im Stil der Figuren, nicht als Pixelklotz
      ctx.save();ctx.scale(1.5,1.5);
      const wx=tx+40;
      ctx.fillStyle='#12091e';ctx.beginPath();ctx.ellipse(wx+5,113,7.4,5.4,0,0,7);ctx.fill();
      ctx.fillStyle='#3f8f86';ctx.beginPath();ctx.ellipse(wx+5,113,6.6,4.6,0,0,7);ctx.fill();
      ctx.fillStyle='#12091e';ctx.beginPath();ctx.arc(wx+5,106.5,5.6,0,7);ctx.fill();
      ctx.fillStyle='#f7d7b8';ctx.beginPath();ctx.arc(wx+5,106.5,4.8,0,7);ctx.fill();
      ctx.fillStyle='#e2c97e';
      ctx.beginPath();ctx.arc(wx+5,105.6,4.8,Math.PI,0);ctx.fill();
      ctx.fillRect(wx+0.2,105.4,1.7,5.4);ctx.fillRect(wx+8.1,105.4,1.7,5.4);
      ctx.fillStyle='#1a1620';ctx.fillRect(wx+3.3,106.2,1,1.2);ctx.fillRect(wx+5.9,106.2,1,1.2);
      ctx.strokeStyle='#a24e5e';ctx.lineWidth=0.7;
      ctx.beginPath();ctx.moveTo(wx+3.4,109.3);ctx.quadraticCurveTo(wx+5,110.2,wx+6.6,109.3);ctx.stroke();
      if(S.tram.cfg.yes){
        const up=Math.sin(t/160)>0?0:1.6;
        ctx.fillStyle='#f7d7b8';
        ctx.beginPath();ctx.arc(wx-1.6,104-up,1.7,0,7);ctx.fill();
        ctx.beginPath();ctx.arc(wx+11.6,104-up,1.7,0,7);ctx.fill();
      }
      ctx.restore();
    }
    if(el>8.6&&!S.tram.done){S.tram.done=true;tramDone();}
  }

  if(showL){
    const sc=(S.scene==='street')?1.8:2;
    const feet=(S.scene==='studio'&&S.pose==='sit')?ly+134:Math.round(ly+89*sc);
    PS=1;px(lx+10,feet,Math.round(38*sc),7,'rgba(10,6,20,0.32)');px(lx+18,feet+5,Math.round(30*sc),4,'rgba(10,6,20,0.22)');
    S._lx=lx;
    const lTalk=S.typing&&S.who==='l';
    const lWalk=S.mode==='tram'&&S.tram&&((t-S.tram.t0)/1000)>=2.4&&((t-S.tram.t0)/1000)<3.9;
    const lProp=S.phoneHand?'phone':(S.scene==='front'&&S.riegel)?'riegel':(S.scene==='street'&&S.bottle)?'bottle':null;
    figure(lx,ly,sc,LAUREN,t,lb,S.scene==='studio'&&S.pose==='sit',1.4,false,mood,mage,lTalk,lWalk,lProp,-1,S.scene==='studio');
    // Tränen — während der Wellen (ab Welle 2) UND danach, deutlich sichtbar
    const cryNow=(S.teary&&S.scene==='street'&&S.mode!=='tram')||(S.mode==='play'&&S.run&&S.run.wave>=1);
    if(cryNow){
      PS=1;
      const t1x=lx+Math.round(15*sc), t2x=lx+Math.round(29*sc), ty0=ly+Math.round(20.5*sc);
      const drop=(t/700)%1;
      ctx.fillStyle='rgba(170,205,255,0.85)';
      ctx.beginPath();ctx.ellipse(t1x,ty0+3+drop*7,2,3.1,0,0,7);ctx.fill();
      ctx.beginPath();ctx.ellipse(t2x,ty0+5+((drop+0.4)%1)*6,1.7,2.6,0,0,7);ctx.fill();
      ctx.fillStyle='rgba(255,255,255,0.5)';
      ctx.fillRect(t1x-1,ty0+2+drop*7,1,1);
      px(t1x-3,ty0-1,7,2,'rgba(190,214,255,0.35)');       // glasiger Unterlid-Schimmer
      px(t2x-3,ty0-1,7,2,'rgba(190,214,255,0.30)');
    }
    // Requisiten zeichnet figure() jetzt direkt in ihrer Hand (prop-Parameter)
  }

  // (POV abgeschafft — Kevin steht als Figur im Bild)

  // HUD
  if(S.mode==='play'&&S.run){
    PS=1.5;
    const r=S.run,bx=294,by=44,bw=14,bh=112;
    px(bx-2,by-2,bw+4,bh+4,'rgba(0,0,0,0.66)');
    px(bx,by,bw,bh,'#141428');
    const lo=r.center-r.band/2;
    const byTop=by+bh-((lo+r.band)/100)*bh;
    px(bx,byTop,bw,(r.band/100)*bh,r.inband?'rgba(255,224,102,0.34)':'rgba(120,140,220,0.24)');
    px(bx,byTop,bw,1,'#ffe066');px(bx,byTop+(r.band/100)*bh-1,bw,1,'#ffe066');
    const vy=by+bh-(r.v/100)*bh;
    px(bx-3,vy-1,bw+6,3,r.inband?'#ffffff':'#ff9a7a');
    px(72,186,176,7,'rgba(0,0,0,0.66)');
    px(74,188,170,3,'#1c1c30');
    px(74,188,Math.max(0,Math.round((r.focus/r.need)*170)),3,r.inband?'#8fe6d2':'#5a6a9a');
    PS=1;
    ctx.font='bold 11px ui-monospace,"Courier New",monospace';ctx.textBaseline='top';
    const lbl=`WELLE ${r.wave+1}/${NW}`;
    ctx.fillStyle='#000';for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++)if(a||b)ctx.fillText(lbl,21+a,252+b);
    ctx.fillStyle='#ffe066';ctx.fillText(lbl,21,252);
  }

  // Titelkarte im DOTT-Kapitel-Stil
  if(S.mode==='title'){
    PS=1;
    px(0,0,W,H,'rgba(8,4,22,0.6)');
    px(0,60,W,120,'rgba(8,4,22,0.55)');
    px(0,60,W,2,'#ffe066');px(0,178,W,2,'#ffe066');
    ctx.textBaseline='top';ctx.textAlign='center';
    ctx.font='bold 29px ui-monospace,"Courier New",monospace';
    ctx.fillStyle='#000';ctx.fillText('EIN DATE MIT LAUREN',W/2+2,96+2);
    ctx.fillStyle='#ffe066';ctx.fillText('EIN DATE MIT LAUREN',W/2,96);
    ctx.font='bold 14px ui-monospace,"Courier New",monospace';
    ctx.fillStyle='#8fe6d2';ctx.fillText('Teil Eins: Der Atem-Raum',W/2,136);
    if(Math.sin(t/380)>0){
      ctx.font='bold 11px ui-monospace,"Courier New",monospace';
      ctx.fillStyle='#c8c8e0';ctx.fillText('— '+(TOUCH?'Tipp':'Klick')+', um anzufangen —',W/2,160);
    }
    ctx.textAlign='left';
  }else{
    const ax=S.who==='l'?(S._lx||W/2)+48:S.who==='k'?(S._kx||W/2)+48:S.who==='j'?280:W/2;
    drawSay(S.full.slice(0,Math.floor(S.shown)),S.col,14,ax);
  }

  // Handy-Overlay am Ende: ihre Nachricht ploppt auf
  if(S.phone&&S.mode==='end'){
    PS=1;
    const age=(t-S.phone.t0)/1000;
    if(age<1.6){                                   // Zeitsprung-Karte, bevor das Handy hochkommt
      ctx.globalAlpha=Math.min(1,age/0.3)*Math.min(1,(1.6-age)/0.4);
      ctx.textAlign='center';ctx.textBaseline='top';
      ctx.font='bold 15px ui-monospace,"Courier New",monospace';
      ctx.fillStyle='#000';ctx.fillText(S.phone.card,W/2+2,132+2);
      ctx.fillStyle='#ffe066';ctx.fillText(S.phone.card,W/2,132);
      ctx.textAlign='left';ctx.globalAlpha=1;
    }
    const py=Math.round(300-Math.min(1,age/0.6)*234);
    px(166,py,148,250,'#04040a');
    px(170,py+4,140,242,'#14141f');
    px(178,py+16,124,216,'#0e1a2c');
    px(178,py+16,124,15,'#0a1422');
    ctx.font='bold 9px ui-monospace,monospace';ctx.textBaseline='top';
    ctx.fillStyle='#8fa8c8';ctx.fillText('07:02',184,py+19);
    ctx.fillStyle='#c8d8ea';ctx.fillText('Lauren ✦',184,py+40);
    px(182,py+36,116,1,'#1c2c44');
    if(age>1.1){
      const k=Math.min(1,(age-1.1)/0.3);
      ctx.globalAlpha=k;
      const bx=184,by=py+60+(1-k)*10;
      px(bx,by,112,58,'#1f6b4e');
      px(bx,by,112,2,'#2e8a66');
      px(bx+4,by+56,6,5,'#1f6b4e');
      ctx.fillStyle='#eafaf0';ctx.font='bold 9px ui-monospace,monospace';
      wrapT(S.phone.msg,18).slice(0,4).forEach((ln,i)=>ctx.fillText(ln,bx+7,by+8+i*13));
      ctx.globalAlpha=1;
    }
    px(228,py+238,24,4,'#2c2c3c');
  }

  schedule();
}

/* Ein Scheduler, doppelt abgesichert: rAF wenn verfügbar, sonst treibt der
   Watchdog die Schleife an (gedrosselte WebViews, Energiesparmodus, Emulation). */
let rafPending=false;
function schedule(){
  if(rafPending)return;
  rafPending=true;
  requestAnimationFrame(tt=>{rafPending=false;frame(tt);});
}
setInterval(()=>{ if(performance.now()-last>200) frame(performance.now()); },100);

reset();
schedule();
})();
</script>
